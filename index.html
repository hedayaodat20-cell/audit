<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة التدقيق الإلكترونية</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Cairo & Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* =========================================================
           ROOT & GLOBAL STYLES
        ========================================================= */
        :root {
            --bg-1: #020b20;
            --bg-2: #061b42;
            --bg-3: #083d69;
            --glass: rgba(255, 255, 255, .075);
            --glass-strong: rgba(255, 255, 255, .11);
            --glass-dark: rgba(0, 12, 35, .28);
            --border: rgba(255, 255, 255, .16);
            --border-light: rgba(255, 255, 255, .24);
            --white: #ffffff;
            --text: #f4f8ff;
            --muted: #aabbd0;
            --blue: #329cff;
            --cyan: #38d9ff;
            --green: #36d996;
            --orange: #ffb454;
            --red: #ff647c;
            --yellow: #f5d76e;
            --shadow: 0 25px 70px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
            --radius: 22px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', 'Cairo', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 20%, rgba(0, 180, 216, 0.14), transparent 25%),
                radial-gradient(circle at 85% 75%, rgba(0, 129, 167, 0.18), transparent 30%),
                linear-gradient(135deg, #020617 0%, #03254c 35%, #004b6e 70%, #0081a7 100%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* Glassmorphism Components */
        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.37), inset 0 0 15px rgba(255, 255, 255, 0.05);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            outline: none;
            border-color: #38bdf8;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .aqua-glow-btn {
            background: linear-gradient(135deg, #0077b6 0%, #00b4d8 100%);
            box-shadow: 0 8px 25px -4px rgba(0, 180, 216, 0.5);
            transition: all 0.3s ease;
        }

        .aqua-glow-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px -4px rgba(0, 180, 216, 0.7);
            background: linear-gradient(135deg, #0096c7 0%, #48cae4 100%);
        }

        /* BACKGROUND ORBS & GRID */
        .background {
            position: fixed;
            inset: 0;
            z-index: -5;
            overflow: hidden;
            pointer-events: none;
        }

        .grid-bg {
            position: absolute;
            inset: 0;
            opacity: .16;
            background-image:
                linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
            background-size: 55px 55px;
            mask-image: linear-gradient(to bottom, black, transparent);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: .35;
            animation: floatOrb 14s ease-in-out infinite alternate;
        }
        .orb.one { width: 360px; height: 360px; background: #0a8cff; top: -100px; left: -80px; }
        .orb.two { width: 300px; height: 300px; background: #18d8ff; right: 8%; top: 10%; animation-delay: 2s; }
        .orb.three { width: 420px; height: 420px; background: #1642bd; bottom: -180px; left: 30%; animation-delay: 4s; }
        .orb.four { width: 220px; height: 220px; background: #2be4d0; right: -70px; bottom: 20%; animation-delay: 6s; }

        @keyframes floatOrb {
            from { transform: translate3d(0,0,0) scale(1); }
            to { transform: translate3d(30px,-25px,0) scale(1.08); }
        }

        /* APP LAYOUT */
        .app {
            display: flex;
            min-height: 100vh;
            gap: 18px;
            padding: 18px;
        }

        /* SIDEBAR */
        .sidebar {
            width: 270px;
            flex-shrink: 0;
            min-height: calc(100vh - 36px);
            background: linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.035));
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--border);
            border-radius: 28px;
            box-shadow: var(--shadow);
            padding: 22px 14px;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 18px;
            height: calc(100vh - 36px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 10px 24px;
            border-bottom: 1px solid rgba(255,255,255,.08);
            margin-bottom: 15px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            border-radius: 15px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, rgba(49,160,255,.85), rgba(22,83,196,.55));
            border: 1px solid rgba(255,255,255,.2);
            box-shadow: 0 8px 25px rgba(0,130,255,.25), inset 0 1px 0 rgba(255,255,255,.25);
        }

        .brand-icon svg { width: 26px; }
        .brand-title { font-weight: 800; font-size: 15px; }
        .brand-sub { color: var(--muted); font-size: 10px; margin-top: 2px; }

        .nav { overflow-y: auto; padding-right: 2px; flex: 1; }
        .nav-section { color: #7f96b1; font-size: 10px; font-weight: 700; padding: 15px 13px 7px; }
        .nav-item {
            width: 100%;
            border: 0;
            background: transparent;
            color: #b9c9dc;
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 11px 13px;
            border-radius: 14px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            transition: .25s ease;
            text-align: right;
        }

        .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
        .nav-item:hover { background: rgba(255,255,255,.07); color: white; }
        .nav-item.active {
            background: linear-gradient(135deg, rgba(42,154,255,.25), rgba(42,90,210,.12));
            color: white;
            border: 1px solid rgba(77,174,255,.18);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 8px 25px rgba(0,100,255,.08);
        }

        .nav-count {
            margin-right: auto;
            background: rgba(255,255,255,.08);
            padding: 2px 7px;
            border-radius: 20px;
            font-size: 9px;
            color: #aac2da;
        }

        .sidebar-footer { margin-top: auto; padding-top: 15px; border-top: 1px solid rgba(255,255,255,.08); }
        .system-status { padding: 12px; border-radius: 15px; background: rgba(0,0,0,.14); border: 1px solid rgba(255,255,255,.07); }
        .status-row { display: flex; align-items: center; gap: 7px; font-size: 10px; color: var(--muted); }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); }

        /* MAIN CONTENT AREA */
        .main { flex: 1; min-width: 0; }
        .topbar {
            height: 72px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 17px;
            border-radius: 22px;
            background: rgba(255,255,255,.065);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .page-title { display: flex; align-items: center; gap: 12px; }
        .page-title h1 { font-size: 18px; font-weight: 800; }
        .page-title p { font-size: 10px; color: var(--muted); }
        .top-actions { display: flex; align-items: center; gap: 9px; }

        .icon-button {
            width: 40px;
            height: 40px;
            border-radius: 13px;
            display: grid;
            place-items: center;
            border: 1px solid var(--border);
            background: rgba(255,255,255,.06);
            color: white;
            cursor: pointer;
            transition: .2s;
            position: relative;
        }
        .icon-button:hover { background: rgba(255,255,255,.11); transform: translateY(-1px); }
        .icon-button svg { width: 18px; }

        .notification-badge {
            position: absolute;
            top: -3px;
            right: -3px;
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            display: grid;
            place-items: center;
            border-radius: 20px;
            background: var(--red);
            color: white;
            font-size: 8px;
            border: 2px solid #061b42;
        }

        .content { animation: fadeIn .35s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(7px); }
            to { opacity: 1; transform: none; }
        }

        /* GLASS CARD & DASHBOARD COMPONENTS */
        .glass {
            background: linear-gradient(145deg, rgba(255,255,255,.105), rgba(255,255,255,.035));
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            border-radius: var(--radius);
        }

        .welcome { padding: 28px; margin-bottom: 18px; position: relative; overflow: hidden; }
        .welcome::after {
            content: "";
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: rgba(40,172,255,.13);
            filter: blur(30px);
            left: -100px;
            top: -120px;
        }
        .welcome-content { position: relative; z-index: 1; }
        .eyebrow { color: #72c7ff; font-size: 10px; font-weight: 700; margin-bottom: 7px; }
        .welcome h2 { font-size: 25px; margin-bottom: 7px; }
        .welcome p { color: var(--muted); font-size: 12px; max-width: 700px; }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
        .stat-card { padding: 18px; min-height: 130px; position: relative; overflow: hidden; }
        .stat-card::before {
            content: "";
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(50,156,255,.09);
            filter: blur(25px);
            left: -30px;
            bottom: -30px;
        }
        .stat-top { display: flex; justify-content: space-between; align-items: center; }
        .stat-icon {
            width: 39px;
            height: 39px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: rgba(48,155,255,.12);
            border: 1px solid rgba(48,155,255,.17);
        }
        .stat-icon svg { width: 19px; }
        .stat-label { font-size: 10px; color: var(--muted); }
        .stat-value { margin-top: 15px; font-size: 24px; font-weight: 800; }

        .dashboard-grid { display: grid; grid-template-columns: 1.35fr .85fr; gap: 18px; }
        .panel { padding: 20px; }
        .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 17px; }
        .panel-title { font-size: 14px; font-weight: 700; }
        .panel-sub { color: var(--muted); font-size: 10px; margin-top: 2px; }

        .empty-state {
            min-height: 190px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: var(--muted);
            padding: 25px;
        }
        .empty-icon {
            width: 52px;
            height: 52px;
            border-radius: 17px;
            display: grid;
            place-items: center;
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.09);
            margin-bottom: 13px;
        }
        .empty-icon svg { width: 24px; opacity: .7; }
        .empty-state strong { color: #eaf3ff; font-size: 12px; margin-bottom: 5px; }
        .empty-state span { font-size: 10px; max-width: 350px; }

        /* BUTTONS */
        .btn {
            border: 1px solid rgba(255,255,255,.14);
            background: linear-gradient(135deg, rgba(42,153,255,.78), rgba(29,84,190,.75));
            color: white;
            padding: 10px 15px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            box-shadow: 0 8px 25px rgba(0,90,220,.18), inset 0 1px 0 rgba(255,255,255,.18);
            transition: .2s;
        }
        .btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
        .btn:active { transform: translateY(1px); }
        .btn svg { width: 15px; }
        .btn.secondary { background: rgba(255,255,255,.07); box-shadow: none; }
        .btn.danger { background: rgba(255,75,103,.13); border-color: rgba(255,75,103,.2); color: #ff9aaa; }
        .btn.success { background: rgba(43,207,141,.13); border-color: rgba(43,207,141,.2); color: #7df0bd; }

        /* PAGE HEADER & SEARCH */
        .page-header { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 18px; }
        .page-header h2 { font-size: 20px; }
        .page-header p { color: var(--muted); font-size: 11px; margin-top: 3px; }
        .page-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 13px;
            background: rgba(255,255,255,.055);
            border: 1px solid var(--border);
            border-radius: 13px;
            margin-bottom: 15px;
        }
        .search-bar svg { width: 17px; color: #8da6bf; }
        .search-bar input {
            flex: 1;
            background: transparent;
            border: 0;
            outline: none;
            color: white;
            font-family: inherit;
            font-size: 11px;
        }
        .search-bar input::placeholder { color: #71859b; }

        /* TABLES */
        .table-wrapper { overflow-x: auto; border-radius: 17px; border: 1px solid rgba(255,255,255,.08); }
        table { width: 100%; border-collapse: collapse; min-width: 750px; }
        th { background: rgba(0,0,0,.14); color: #8fa7c0; font-size: 10px; font-weight: 600; padding: 13px; text-align: right; white-space: nowrap; }
        td { padding: 13px; border-top: 1px solid rgba(255,255,255,.055); color: #dbe8f6; font-size: 10px; }
        tr:hover td { background: rgba(255,255,255,.025); }

        /* BADGES */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 9px;
            border-radius: 30px;
            font-size: 8px;
            font-weight: 700;
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.09);
        }
        .badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
        .badge.green { color: #62e9ac; }
        .badge.orange { color: #ffc66e; }
        .badge.red { color: #ff8193; }
        .badge.blue { color: #69c1ff; }
        .badge.gray { color: #9aafc3; }

        /* FORMS & MODALS */
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .form-group { display: flex; flex-direction: column; gap: 7px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label { color: #c3d2e3; font-size: 10px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            background: linear-gradient(145deg, rgba(0,12,35,.34), rgba(255,255,255,.035));
            border: 1px solid rgba(255,255,255,.11);
            color: white;
            border-radius: 12px;
            padding: 11px 12px;
            outline: none;
            font-family: inherit;
            font-size: 11px;
            transition: .2s;
        }
        .form-group textarea { min-height: 100px; resize: vertical; }
        .form-group select option { background: #071a38; color: white; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: rgba(57,169,255,.55);
            box-shadow: 0 0 0 3px rgba(46,156,255,.08), 0 0 25px rgba(30,139,255,.08);
        }

        .modal-actions { display: flex; justify-content: flex-start; gap: 8px; margin-top: 20px; }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,7,22,.62);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            width: min(680px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: linear-gradient(145deg, rgba(15,49,88,.92), rgba(5,21,49,.94));
            border: 1px solid var(--border-light);
            border-radius: 24px;
            box-shadow: 0 35px 100px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12);
            padding: 24px;
            animation: modalIn .25s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: translateY(12px) scale(.98); }
            to { opacity: 1; transform: none; }
        }
        .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .modal-header h3 { font-size: 16px; }
        .close-modal {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,.05);
            color: white;
            cursor: pointer;
            display: grid;
            place-items: center;
        }

        /* WORKSPACE & AUDIT SECTIONS */
        .workspace-header { padding: 20px; margin-bottom: 16px; }
        .workspace-info { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
        .workspace-info h2 { font-size: 18px; }
        .workspace-info p { color: var(--muted); font-size: 10px; margin-top: 4px; }
        .progress { width: 220px; height: 7px; background: rgba(255,255,255,.08); border-radius: 20px; overflow: hidden; }
        .progress span { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--cyan)); border-radius: inherit; width: 0%; transition: .4s; }
        .progress-text { font-size: 9px; color: var(--muted); text-align: left; margin-top: 5px; }

        .audit-sections { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .audit-section { padding: 15px; cursor: pointer; transition: .2s; }
        .audit-section:hover { transform: translateY(-2px); background: rgba(255,255,255,.09); }
        .audit-section-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: rgba(49,156,255,.1);
            border: 1px solid rgba(49,156,255,.15);
            margin-bottom: 12px;
        }
        .audit-section-icon svg { width: 18px; }
        .audit-section strong { font-size: 11px; }
        .audit-section small { display: block; color: var(--muted); font-size: 8px; margin-top: 4px; }

        /* TIMELINE & NOTIFICATIONS & TOAST */
        .timeline { display: flex; flex-direction: column; }
        .timeline-item { display: flex; gap: 14px; position: relative; padding-bottom: 18px; }
        .timeline-item:not(:last-child)::before {
            content: "";
            position: absolute;
            right: 9px;
            top: 22px;
            bottom: 0;
            width: 1px;
            background: rgba(255,255,255,.1);
        }
        .timeline-dot {
            width: 19px;
            height: 19px;
            flex-shrink: 0;
            border-radius: 50%;
            background: rgba(55,162,255,.2);
            border: 1px solid rgba(75,180,255,.35);
            position: relative;
            z-index: 1;
        }
        .timeline-content { flex: 1; }
        .timeline-content strong { font-size: 10px; }
        .timeline-content p { color: var(--muted); font-size: 9px; margin-top: 3px; }
        .timeline-time { color: #718ba6; font-size: 8px; }

        .notification-panel {
            position: fixed;
            top: 82px;
            left: 28px;
            width: 340px;
            max-width: calc(100vw - 40px);
            background: linear-gradient(145deg, rgba(13,43,78,.96), rgba(3,18,42,.97));
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 30px 80px rgba(0,0,0,.45);
            z-index: 800;
            display: none;
            overflow: hidden;
        }
        .notification-panel.show { display: block; }
        .notification-head { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid rgba(255,255,255,.08); }
        .notification-head h3 { font-size: 12px; }
        .notification-list { max-height: 380px; overflow-y: auto; }
        .notification-item { padding: 13px 15px; border-bottom: 1px solid rgba(255,255,255,.055); }
        .notification-item strong { display: block; font-size: 10px; }
        .notification-item p { color: var(--muted); font-size: 9px; margin-top: 4px; }
        .notification-item time { display: block; color: #69839e; font-size: 8px; margin-top: 5px; }

        .toast-container { position: fixed; bottom: 20px; left: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
        .toast {
            min-width: 280px;
            max-width: 400px;
            background: linear-gradient(145deg, rgba(17,52,88,.95), rgba(4,22,49,.96));
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 13px 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,.4);
            animation: toastIn .25s ease;
            font-size: 10px;
        }
        .toast strong { display: block; font-size: 11px; margin-bottom: 3px; }
        .toast p { color: var(--muted); }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: none; }
        }

        .risk-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; }

    <script>
        /* STORAGE MANAGEMENT */
        const STORAGE_KEY = "electronic_audit_portal_v1";
        const defaultState = {
            clients: [],
            engagements: [],
            documents: [],
            transactions: [],
            tests: [],
            samples: [],
            exceptions: [],
            inquiries: [],
            workingPapers: [],
            analyticalReviews: [],
            reports: [],
            archive: [],
            auditTrail: [],
            notifications: []
        };

        let state = loadState();

        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (!saved) return structuredClone(defaultState);
                return { ...structuredClone(defaultState), ...JSON.parse(saved) };
            } catch (error) {
                console.error(error);
                return structuredClone(defaultState);
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            updateCounters();
        }

        /* UTILITIES */
        function uid(prefix = "ID") {
            const random = Math.random().toString(36).substring(2, 8).toUpperCase();
            return `${prefix}-${Date.now().toString(36).toUpperCase()}-${random}`;
        }

        function formatDate(date = new Date()) {
            return new Intl.DateTimeFormat("ar-JO", { year: "numeric", month: "2-digit", day: "2-digit" }).format(date);
        }

        function formatDateTime(date = new Date()) {
            return new Intl.DateTimeFormat("ar-JO", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }).format(date);
        }

        function escapeHTML(value) {
            if (value === null || value === undefined) return "";
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function addAuditLog(action, entity, entityId, details = "") {
            state.auditTrail.unshift({
                id: uid("LOG"),
                action,
                entity,
                entityId,
                details,
                timestamp: new Date().toISOString()
            });
        }

        function addNotification(title, message) {
            state.notifications.unshift({
                id: uid("NOT"),
                title,
                message,
                timestamp: new Date().toISOString(),
                read: false
            });
        }

        function toast(title, message) {
            const container = document.getElementById("toastContainer");
            const element = document.createElement("div");
            element.className = "toast";
            element.innerHTML = `<strong>${escapeHTML(title)}</strong><p>${escapeHTML(message)}</p>`;
            container.appendChild(element);
            setTimeout(() => {
                element.style.opacity = "0";
                element.style.transform = "translateX(-20px)";
                setTimeout(() => element.remove(), 250);
            }, 3500);
        }

        function updateCounters() {
            const counters = {
                clientsCount: state.clients.length,
                engagementsCount: state.engagements.length,
                documentsCount: state.documents.length,
                transactionsCount: state.transactions.length,
                testsCount: state.tests.length,
                exceptionsCount: state.exceptions.length,
                inquiriesCount: state.inquiries.length
            };
            Object.entries(counters).forEach(([id, value]) => {
                const element = document.getElementById(id);
                if (element) element.textContent = value;
            });
            const unread = state.notifications.filter(n => !n.read).length;
            document.getElementById("notificationBadge").textContent = unread;
        }

      async function handleLogin(event) {
    event.preventDefault();

    const form = event.target;
    const email = form.querySelector('input[type="text"]').value.trim();
    const password = form.querySelector('input[type="password"]').value;

    try {
        const { error } = await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

        if (error) {
            toast("فشل تسجيل الدخول", "البريد الإلكتروني أو كلمة المرور غير صحيحة.");
            return;
        }

        document.getElementById("loginScreen").classList.add("hidden");
        document.getElementById("portalScreen").classList.remove("hidden");

        updateCounters();
        renderNotifications();
        navigate("dashboard");

        toast("مرحباً بك", "تم تسجيل الدخول إلى بوابة التدقيق بنجاح.");

    } catch (error) {
        console.error(error);
        toast("خطأ", "حدث خطأ أثناء تسجيل الدخول.");
    }
}

async function handleLogout() {
    try {
        const { error } = await supabaseClient.auth.signOut();

        if (error) {
            console.error(error);
            toast("خطأ", "تعذر تسجيل الخروج.");
            return;
        }

        document.getElementById("portalScreen").classList.add("hidden");
        document.getElementById("loginScreen").classList.remove("hidden");

        toast("تم الخروج", "تم تسجيل الخروج بنجاح.");

    } catch (error) {
        console.error(error);
        toast("خطأ", "حدث خطأ أثناء تسجيل الخروج.");
    }
}
        /* NAVIGATION & PAGES CONFIG */
        const pageInfo = {
            dashboard: ["لوحة التحكم", "نظرة عامة على بيئة التدقيق"],
            clients: ["العملاء", "إدارة بيانات العملاء"],
            engagements: ["مهام التدقيق", "إنشاء وإدارة مهام التدقيق"],
            documents: ["المستندات", "إدارة المستندات المطلوبة والمرفوعة"],
            transactions: ["البيانات والعمليات", "البيانات المحاسبية والعمليات محل الاختبار"],
            preaudit: ["الفحص الآلي", "الفحص الأولي والاستثناءات الآلية"],
            workspace: ["مساحة التدقيق", "بيئة العمل الخاصة بالمهمة"],
            tests: ["الاختبارات", "إجراءات واختبارات التدقيق"],
            samples: ["العينات", "إدارة عينات التدقيق"],
            exceptions: ["الاستثناءات", "إدارة الاستثناءات والمخاطر"],
            inquiries: ["الاستفسارات", "طلبات التوضيح والتواصل مع العميل"],
            workingpapers: ["أوراق العمل", "Electronic Working Papers"],
            analytical: ["المراجعة التحليلية", "تحليل الفروقات والاتجاهات"],
            review: ["المراجعة الداخلية", "مراجعة واعتماد أعمال التدقيق"],
            reports: ["التقارير", "إعداد وإدارة تقارير التدقيق"],
            archive: ["الأرشيف", "الملفات المغلقة والمؤرشفة"],
            audittrail: ["سجل التدقيق", "سجل العمليات والتغييرات"]
        };

        document.querySelectorAll(".nav-item[data-page]").forEach(button => {
            button.addEventListener("click", () => {
                navigate(button.dataset.page);
            });
        });

        function navigate(page) {
            document.querySelectorAll(".nav-item[data-page]").forEach(item => {
                item.classList.toggle("active", item.dataset.page === page);
            });
            const info = pageInfo[page];
            if (info) {
                document.getElementById("currentPageTitle").textContent = info[0];
                document.getElementById("currentPageSubtitle").textContent = info[1];
            }
            renderPage(page);
            document.getElementById("sidebar").classList.remove("open");
            lucide.createIcons();
        }

        /* RENDER DASHBOARD */
        function renderDashboard() {
            const content = document.getElementById("content");
            content.innerHTML = `
                <div class="welcome glass">
                    <div class="welcome-content">
                        <div class="eyebrow">ELECTRONIC AUDIT ENVIRONMENT</div>
                        <h2>بيئة التدقيق الإلكترونية</h2>
                        <p>ابدأ بإضافة العملاء وإنشاء مهام التدقيق. متابعة دقيقة لعمليات وإجراءات المراجعة.</p>
                    </div>
                </div>
                <div class="stats-grid">
                    ${statCard("العملاء", state.clients.length, "users")}
                    ${statCard("مهام التدقيق", state.engagements.length, "briefcase")}
                    ${statCard("المستندات", state.documents.length, "file-text")}
                    ${statCard("الاستثناءات", state.exceptions.length, "alert-triangle")}
                </div>
                <div class="dashboard-grid">
                    <div class="panel glass">
                        <div class="panel-header">
                            <div>
                                <div class="panel-title">سير العمل</div>
                                <div class="panel-sub">آخر العمليات المسجلة في النظام</div>
                            </div>
                        </div>
                        ${renderTimeline()}
                    </div>
                    <div class="panel glass">
                        <div class="panel-header">
                            <div>
                                <div class="panel-title">حالة النظام</div>
                                <div class="panel-sub">البيانات الحالية</div>
                            </div>
                        </div>
                        ${renderSystemSummary()}
                    </div>
                </div>
            `;
        }

        function statCard(label, value, icon) {
            return `
                <div class="stat-card glass">
                    <div class="stat-top">
                        <span class="stat-label">${label}</span>
                        <div class="stat-icon"><i data-lucide="${icon}"></i></div>
                    </div>
                    <div class="stat-value">${value}</div>
                </div>
            `;
        }

        function renderTimeline() {
            if (state.auditTrail.length === 0) {
                return emptyState("لا توجد عمليات مسجلة", "ستظهر هنا العمليات التي يتم تنفيذها داخل النظام.");
            }
            const logs = state.auditTrail.slice(0, 6);
            return `
                <div class="timeline">
                    ${logs.map(log => `
                        <div class="timeline-item">
                            <div class="timeline-dot"></div>
                            <div class="timeline-content">
                                <strong>${escapeHTML(log.action)}</strong>
                                <p>${escapeHTML(log.details || log.entity)}</p>
                                <span class="timeline-time">${formatDateTime(new Date(log.timestamp))}</span>
                            </div>
                        </div>
                    `).join("")}
                </div>
            `;
        }

        function renderSystemSummary() {
            return `
                <div class="timeline">
                    <div class="timeline-item">
                        <div class="timeline-dot"></div>
                        <div class="timeline-content"><strong>العملاء</strong><p>${state.clients.length} عميل</p></div>
                    </div>
                    <div class="timeline-item">
                        <div class="timeline-dot"></div>
                        <div class="timeline-content"><strong>مهام التدقيق</strong><p>${state.engagements.length} مهمة</p></div>
                    </div>
                    <div class="timeline-item">
                        <div class="timeline-dot"></div>
                        <div class="timeline-content"><strong>البيانات</strong><p>${state.transactions.length} عملية</p></div>
                    </div>
                    <div class="timeline-item">
                        <div class="timeline-dot"></div>
                        <div class="timeline-content"><strong>الاستثناءات</strong><p>${state.exceptions.length} استثناء</p></div>
                    </div>
                </div>
            `;
        }

        function emptyState(title, text) {
            return `
                <div class="empty-state">
                    <div class="empty-icon"><i data-lucide="folder-open"></i></div>
                    <strong>${title}</strong>
                    <span>${text}</span>
                </div>
            `;
        }

        /* RENDER CLIENTS */
        function renderClients() {
            const content = document.getElementById("content");
            content.innerHTML = `
                <div class="page-header">
                    <div><h2>العملاء</h2><p>إدارة ملفات العملاء وبياناتهم.</p></div>
                    <div class="page-actions">
                        <button class="btn" onclick="openClientModal()"><i data-lucide="plus"></i> إضافة عميل</button>
                    </div>
                </div>
                <div class="glass panel">
                    <div class="search-bar">
                        <i data-lucide="search"></i>
                        <input id="clientSearch" placeholder="البحث في العملاء..." oninput="filterClients(this.value)">
                    </div>
                    <div id="clientsTable"></div>
                </div>
            `;
            renderClientsTable();
        }

        function renderClientsTable(list = state.clients) {
            const container = document.getElementById("clientsTable");
            if (!container) return;
            if (list.length === 0) {
                container.innerHTML = emptyState("لا يوجد عملاء", "أضف أول عميل لبدء دورة التدقيق.");
                return;
            }
            container.innerHTML = `

        function runPreAudit() {
            if (state.transactions.length === 0) {
                toast("لا توجد بيانات", "أضف عمليات قبل تشغيل الفحص.");
                return;
            }
            let high = 0, medium = 0, low = 0;
            const results = [];
            state.transactions.forEach(t => {
                const debit = parseFloat(t.debit) || 0;
                const credit = parseFloat(t.credit) || 0;
                if (debit > 0 && credit > 0 && debit !== credit) {
                    high++;
                    results.push({ transaction: t, level: "High", message: "يوجد اختلاف بين المدين والدائن." });
                } else if (parseFloat(t.amount) >= 100000) {
                    medium++;
                    results.push({ transaction: t, level: "Medium", message: "قيمة العملية مرتفعة وتحتاج إلى مراجعة." });
                } else {
                    low++;
                }
            });
            document.getElementById("highRisk").textContent = high;
            document.getElementById("mediumRisk").textContent = medium;
            document.getElementById("lowRisk").textContent = low;

            const container = document.getElementById("preAuditResults");
            if (results.length === 0) {
                container.innerHTML = emptyState("لم يتم اكتشاف استثناءات", "لم ينتج عن الفحص الحالي أي تنبيه.");
            } else {
                container.innerHTML = `
                    <div class="table-wrapper">
                        <table>
                            <thead><tr><th>المرجع</th><th>مستوى الخطورة</th><th>النتيجة</th></tr></thead>
                            <tbody>
                                ${results.map(r => `
                                    <tr>
                                        <td>${escapeHTML(r.transaction.reference)}</td>
                                        <td>${riskBadge(r.level)}</td>
                                        <td>${escapeHTML(r.message)}</td>
                                    </tr>
                                `).join("")}
                            </tbody>
                        </table>
                    </div>
                `;
            }
            addAuditLog("تشغيل الفحص الآلي", "PreAudit", uid("SCAN"), `تم فحص ${state.transactions.length} عملية.`);
            saveState();
            toast("اكتمل الفحص", "تم تحليل البيانات الحالية.");
            lucide.createIcons();
        }

        function riskBadge(level) {
            const map = { High: "red", Medium: "orange", Low: "blue" };
            const labels = { High: "عالية", Medium: "متوسطة", Low: "منخفضة" };
            return `<span class="badge ${map[level]}">${labels[level]}</span>`;
        }

                    previous: form.get("previous"),
                    current: form.get("current"),

                    <div class="modal-actions"><button class="btn" type="submit">حفظ الملاحظة</button></div>
                </form>
            `);
            document.getElementById("reviewForm").addEventListener("submit", e => {
                e.preventDefault();
                const form = new FormData(e.target);
                addAuditLog("ملاحظة مراجعة", "Review", uid("REV"), form.get("note").trim());
                saveState();
                closeModal();
                toast("تم حفظ الملاحظة", "تم تسجيل ملاحظة المراجع.");
                renderReview();
            });
        }

        function renderReports() {
            document.getElementById("content").innerHTML = `
                <div class="page-header">
                    <div><h2>التقارير</h2><p>إعداد مسودات تقارير التدقيق وإدارتها.</p></div>
                    <button class="btn" onclick="openReportModal()"><i data-lucide="plus"></i> إنشاء تقرير</button>
                </div>
                <div class="glass panel">
                    ${state.reports.length === 0 ? emptyState("لا توجد تقارير", "سيظهر التقرير هنا بعد إنشاء مسودة.") : `
                        <div class="table-wrapper">
                            <table>
                                <thead><tr><th>رقم التقرير</th><th>المهمة</th><th>العنوان</th><th>الإصدار</th><th>الحالة</th><th>التاريخ</th></tr></thead>
                                <tbody>
                                    ${state.reports.map(r => `
                                        <tr>
                                            <td>${escapeHTML(r.id)}</td>
                                            <td>${escapeHTML(r.engagementId || "—")}</td>
                                            <td>${escapeHTML(r.title)}</td>
                                            <td>${escapeHTML(r.version)}</td>
                                            <td>${statusBadge(r.status)}</td>
                                            <td>${escapeHTML(r.createdAt)}</td>
                                        </tr>
                                    `).join("")}
                                </tbody>
                            </table>
                        </div>
                    `}
                </div>
            `;
            lucide.createIcons();
        }

        function openReportModal() {
            openModal("إنشاء مسودة تقرير", `
                <form id="reportForm">
                    <div class="form-grid">
                        <div class="form-group full">
                            <label>مهمة التدقيق</label>
                            <select name="engagementId">
                                <option value="">بدون ربط</option>
                                ${state.engagements.map(e => `<option value="${e.id}">${escapeHTML(e.id)}</option>`).join("")}
                            </select>
                        </div>
                        <div class="form-group full"><label>عنوان التقرير *</label><input name="title" required></div>
                        <div class="form-group full"><label>النتائج</label><textarea name="findings"></textarea></div>
                    </div>
                    <div class="modal-actions"><button class="btn" type="submit">إنشاء المسودة</button></div>
                </form>
            `);
            document.getElementById("reportForm").addEventListener("submit", e => {
                e.preventDefault();
                const form = new FormData(e.target);
                const report = {
                    id: uid("REP"),
                    engagementId: form.get("engagementId"),
                    title: form.get("title").trim(),
                    findings: form.get("findings").trim(),
                    version: 1,
                    status: "مسودة",
                    createdAt: formatDate()
                };
                state.reports.push(report);
                addAuditLog("إنشاء تقرير", "Report", report.id, report.title);
                saveState();
                closeModal();
                toast("تم إنشاء التقرير", "تم إنشاء مسودة التقرير.");
                renderReports();
            });
        }

        function renderArchive() {
            document.getElementById("content").innerHTML = `
                <div class="page-header">
                    <div><h2>الأرشيف</h2><p>الملفات التي تم إغلاقها وأرشفتها.</p></div>
                    <button class="btn" onclick="archiveEngagementModal()"><i data-lucide="plus"></i> أرشفة مهمة</button>
                </div>
                <div class="glass panel">
                    ${state.archive.length === 0 ? emptyState("الأرشيف فارغ", "ستظهر الملفات هنا بعد اكتمال دورة التدقيق وأرشفتها.") : `
                        <div class="table-wrapper">
                            <table>
                                <thead><tr><th>المهمة</th><th>تاريخ الأرشفة</th><th>الحالة</th></tr></thead>
                                <tbody>
                                    ${state.archive.map(a => `
                                        <tr>
                                            <td>${escapeHTML(a.engagementId)}</td>
                                            <td>${escapeHTML(a.archivedAt)}</td>
                                            <td>${statusBadge("مؤرشفة")}</td>
                                        </tr>
                                    `).join("")}
                                </tbody>
                            </table>
                        </div>
                    `}
                </div>
            `;
            lucide.createIcons();
        }

        function archiveEngagementModal() {
            if (state.engagements.length === 0) {
                toast("لا توجد مهام", "أنشئ مهمة تدقيق أولًا.");
                return;
            }
            openModal("أرشفة مهمة", `
                <form id="archiveForm">
                    <div class="form-group">
                        <label>المهمة *</label>
                        <select name="engagementId" required>
                            ${state.engagements.map(e => `<option value="${e.id}">${escapeHTML(e.id)}</option>`).join("")}
                        </select>
                    </div>
                    <div class="modal-actions"><button class="btn" type="submit">أرشفة</button></div>
                </form>
            `);
            document.getElementById("archiveForm").addEventListener("submit", e => {
                e.preventDefault();
                const id = new FormData(e.target).get("engagementId");
                if (state.archive.some(a => a.engagementId === id)) {
                    toast("موجودة في الأرشيف", "هذه المهمة مؤرشفة بالفعل.");
                    return;
                }
                state.archive.push({ id: uid("ARC"), engagementId: id, archivedAt: formatDate(), status: "Archived" });
                const engagement = state.engagements.find(e => e.id === id);
                if (engagement) engagement.status = "مؤرشفة";
                addAuditLog("أرشفة مهمة", "Archive", id, "تم أرشفة مهمة التدقيق.");
                saveState();
                closeModal();
                toast("تمت الأرشفة", "تم أرشفة المهمة بنجاح.");
                renderArchive();
            });
        }

        function renderAuditTrail() {
            document.getElementById("content").innerHTML = `
                <div class="page-header">
                    <div><h2>سجل التدقيق</h2><p>سجل مركزي للإجراءات والتغييرات داخل النظام.</p></div>
                </div>
                <div class="glass panel">
                    ${state.auditTrail.length === 0 ? emptyState("السجل فارغ", "ستُسجل هنا عمليات الإنشاء والتعديل والتنفيذ.") : `
                        <div class="table-wrapper">
                            <table>
                                <thead><tr><th>التاريخ</th><th>الإجراء</th><th>النوع</th><th>المرجع</th><th>التفاصيل</th></tr></thead>
                                <tbody>
                                    ${state.auditTrail.map(log => `
                                        <tr>
                                            <td>${formatDateTime(new Date(log.timestamp))}</td>
                                            <td>${escapeHTML(log.action)}</td>
                                            <td>${escapeHTML(log.entity)}</td>
                                            <td>${escapeHTML(log.entityId)}</td>
                                            <td>${escapeHTML(log.details || "—")}</td>
                                        </tr>
                                    `).join("")}
                                </tbody>
                            </table>
                        </div>
                    `}
                </div>
            `;
            lucide.createIcons();
        }

        function renderPage(page) {
            const renderers = {
                dashboard: renderDashboard,
                clients: renderClients,
                engagements: renderEngagements,
                documents: renderDocuments,
                transactions: renderTransactions,
                preaudit: renderPreAudit,
                workspace: renderWorkspace,
                tests: renderTests,
                samples: renderSamples,
                exceptions: renderExceptions,
                inquiries: renderInquiries,
                workingpapers: renderWorkingPapers,
                analytical: renderAnalytical,
                review: renderReview,
                reports: renderReports,
                archive: renderArchive,
                audittrail: renderAuditTrail
            };
            const renderer = renderers[page] || renderDashboard;
            renderer();
            lucide.createIcons();
        }

        /* MODAL & NOTIFICATIONS EVENTS */
        function openModal(title, body) {
            document.getElementById("modalTitle").textContent = title;
            document.getElementById("modalBody").innerHTML = body;
            document.getElementById("modalOverlay").classList.add("show");
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById("modalOverlay").classList.remove("show");
        }

        document.getElementById("closeModal").addEventListener("click", closeModal);
        document.getElementById("modalOverlay").addEventListener("click", e => {
            if (e.target.id === "modalOverlay") closeModal();
        });

        document.getElementById("notificationButton").addEventListener("click", () => {
            const panel = document.getElementById("notificationPanel");
            panel.classList.toggle("show");
            state.notifications.forEach(n => n.read = true);
            saveState();
            renderNotifications();
        });

        function renderNotifications() {
            const container = document.getElementById("notificationList");
            if (state.notifications.length === 0) {
                container.innerHTML = emptyState("لا توجد إشعارات", "ستظهر الإشعارات هنا.");
                return;
            }
            container.innerHTML = state.notifications.slice(0, 20).map(n => `
                <div class="notification-item">
                    <strong>${escapeHTML(n.title)}</strong>
                    <p>${escapeHTML(n.message)}</p>
                    <time>${formatDateTime(new Date(n.timestamp))}</time>
                </div>
            `).join("");
        }

        document.getElementById("clearNotifications").addEventListener("click", () => {
            state.notifications = [];
            saveState();
            renderNotifications();
            toast("تم المسح", "تم حذف الإشعارات المحلية.");
        });

        document.getElementById("mobileMenu").addEventListener("click", () => {
            document.getElementById("sidebar").classList.toggle("open");
        });

      
      window.onload = function() {
    lucide.createIcons();
};
</script>
