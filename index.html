
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>بوابة التدقيق الإلكترونية - المدقق</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Supabase - تعريف واحد فقط -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Tajawal:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --bg-1: #020b20;
            --bg-2: #061b42;
            --bg-3: #083d69;
            --glass: rgba(255, 255, 255, .075);
            --glass-strong: rgba(255, 255, 255, .11);
            --glass-dark: rgba(0, 12, 35, .28);
            --border: rgba(255, 255, 255, .16);
            --border-light: rgba(255, 255, 255, .24);
            --white: #ffffff;
            --text: #f4f8ff;
            --muted: #aabbd0;
            --blue: #329cff;
            --cyan: #38d9ff;
            --green: #36d996;
            --orange: #ffb454;
            --red: #ff647c;
            --yellow: #f5d76e;
            --shadow: 0 25px 70px rgba(0,0,0,.35),
                       inset 0 1px 0 rgba(255,255,255,.08);
            --radius: 22px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', 'Cairo', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 20%, rgba(0, 180, 216, 0.14), transparent 25%),
                radial-gradient(circle at 85% 75%, rgba(0, 129, 167, 0.18), transparent 30%),
                linear-gradient(
                    135deg,
                    #020617 0%,
                    #03254c 35%,
                    #004b6e 70%,
                    #0081a7 100%
                );
            background-attachment: fixed;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.37),
                inset 0 0 15px rgba(255, 255, 255, 0.05);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            outline: none;
            border-color: #38bdf8;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .aqua-glow-btn {
            background:
                linear-gradient(
                    135deg,
                    #0077b6 0%,
                    #00b4d8 100%
                );
            box-shadow:
                0 8px 25px -4px rgba(0, 180, 216, 0.5);
            transition: all 0.3s ease;
        }

        .aqua-glow-btn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 12px 30px -4px rgba(0, 180, 216, 0.7);
            background:
                linear-gradient(
                    135deg,
                    #0096c7 0%,
                    #48cae4 100%
                );
        }

        .background {
            position: fixed;
            inset: 0;
            z-index: -5;
            overflow: hidden;
            pointer-events: none;
        }

        .grid-bg {
            position: absolute;
            inset: 0;
            opacity: .16;
            background-image:
                linear-gradient(
                    rgba(255,255,255,.04) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.04) 1px,
                    transparent 1px
                );
            background-size: 55px 55px;
            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent
                );
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: .35;
            animation:
                floatOrb
                14s
                ease-in-out
                infinite
                alternate;
        }

        .orb.one {
            width: 360px;
            height: 360px;
            background: #0a8cff;
            top: -100px;
            left: -80px;
        }

        .orb.two {
            width: 300px;
            height: 300px;
            background: #18d8ff;
            right: 8%;
            top: 10%;
            animation-delay: 2s;
        }

        .orb.three {
            width: 420px;
            height: 420px;
            background: #1642bd;
            bottom: -180px;
            left: 30%;
            animation-delay: 4s;
        }

        .orb.four {
            width: 220px;
            height: 220px;
            background: #2be4d0;
            right: -70px;
            bottom: 20%;
            animation-delay: 6s;
        }

        @keyframes floatOrb {
            from {
                transform:
                    translate3d(0,0,0)
                    scale(1);
            }

            to {
                transform:
                    translate3d(30px,-25px,0)
                    scale(1.08);
            }
        }

        .app {
            display: flex;
            min-height: 100vh;
            gap: 18px;
            padding: 18px;
        }

        .sidebar {
            width: 270px;
            flex-shrink: 0;
            min-height: calc(100vh - 36px);
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.10),
                    rgba(255,255,255,.035)
                );
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--border);
            border-radius: 28px;
            box-shadow: var(--shadow);
            padding: 22px 14px;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 18px;
            height: calc(100vh - 36px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 10px 24px;
            border-bottom: 1px solid rgba(255,255,255,.08);
            margin-bottom: 15px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            border-radius: 15px;
            display: grid;
            place-items: center;
            background:
                linear-gradient(
                    135deg,
                    rgba(49,160,255,.85),
                    rgba(22,83,196,.55)
                );
            border: 1px solid rgba(255,255,255,.2);
            box-shadow:
                0 8px 25px rgba(0,130,255,.25),
                inset 0 1px 0 rgba(255,255,255,.25);
        }

        .brand-icon svg {
            width: 26px;
        }

        .brand-title {
            font-weight: 800;
            font-size: 15px;
        }

        .brand-sub {
            color: var(--muted);
            font-size: 10px;
            margin-top: 2px;
        }

        .nav {
            overflow-y: auto;
            padding-right: 2px;
            flex: 1;
        }

        .nav-section {
            color: #7f96b1;
            font-size: 10px;
            font-weight: 700;
            padding: 15px 13px 7px;
        }

        .nav-item {
            width: 100%;
            border: 0;
            background: transparent;
            color: #b9c9dc;
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 11px 13px;
            border-radius: 14px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            transition: .25s ease;
            text-align: right;
        }

        .nav-item svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .nav-item:hover {
            background: rgba(255,255,255,.07);
            color: white;
        }

        .nav-item.active {
            background:
                linear-gradient(
                    135deg,
                    rgba(42,154,255,.25),
                    rgba(42,90,210,.12)
                );
            color: white;
            border: 1px solid rgba(77,174,255,.18);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.08),
                0 8px 25px rgba(0,100,255,.08);
        }

        .nav-count {
            margin-right: auto;
            background: rgba(255,255,255,.08);
            padding: 2px 7px;
            border-radius: 20px;
            font-size: 9px;
            color: #aac2da;
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,.08);
        }

        .system-status {
            padding: 12px;
            border-radius: 15px;
            background: rgba(0,0,0,.14);
            border: 1px solid rgba(255,255,255,.07);
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 10px;
            color: var(--muted);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            box-shadow:
                0 0 10px var(--green);
        }

        .main {
            flex: 1;
            min-width: 0;
        }

        .topbar {
            height: 72px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 17px;
            border-radius: 22px;
            background: rgba(255,255,255,.065);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .page-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-title h1 {
            font-size: 18px;
            font-weight: 800;
        }

        .page-title p {
            font-size: 10px;
            color: var(--muted);
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .icon-button {
            width: 40px;
            height: 40px;
            border-radius: 13px;
            display: grid;
            place-items: center;
            border: 1px solid var(--border);
            background: rgba(255,255,255,.06);
            color: white;
            cursor: pointer;
            transition: .2s;
            position: relative;
        }

        .icon-button:hover {
            background: rgba(255,255,255,.11);
            transform: translateY(-1px);
        }

        .icon-button svg {
            width: 18px;
        }

        .notification-badge {
            position: absolute;
            top: -3px;
            right: -3px;
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            display: grid;
            place-items: center;
            border-radius: 20px;
            background: var(--red);
            color: white;
            font-size: 8px;
            border: 2px solid #061b42;
        }

        .content {
            animation: fadeIn .35s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(7px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .glass {
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.105),
                    rgba(255,255,255,.035)
                );
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            border-radius: var(--radius);
        }

        .welcome {
            padding: 28px;
            margin-bottom: 18px;
            position: relative;
            overflow: hidden;
        }

        .welcome::after {
            content: "";
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: rgba(40,172,255,.13);
            filter: blur(30px);
            left: -100px;
            top: -120px;
        }

        .welcome-content {
            position: relative;
            z-index: 1;
        }

        .eyebrow {
            color: #72c7ff;
            font-size: 10px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .welcome h2 {
            font-size: 25px;
            margin-bottom: 7px;
        }

        .welcome p {
            color: var(--muted);
            font-size: 12px;
            max-width: 700px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 18px;
        }

        .stat-card {
            padding: 18px;
            min-height: 130px;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: "";
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(50,156,255,.09);
            filter: blur(25px);
            left: -30px;
            bottom: -30px;
        }

        .stat-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-icon {
            width: 39px;
            height: 39px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: rgba(48,155,255,.12);
            border: 1px solid rgba(48,155,255,.17);
        }

        .stat-icon svg {
            width: 19px;
        }

        .stat-label {
            font-size: 10px;
            color: var(--muted);
        }

        .stat-value {
            margin-top: 15px;
            font-size: 24px;
            font-weight: 800;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1.35fr .85fr;
            gap: 18px;
        }

        .panel {
            padding: 20px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 17px;
        }

        .panel-title {
            font-size: 14px;
            font-weight: 700;
        }

        .panel-sub {
            color: var(--muted);
            font-size: 10px;
            margin-top: 2px;
        }

        .empty-state {
            min-height: 190px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: var(--muted);
            padding: 25px;
        }

        .empty-icon {
            width: 52px;
            height: 52px;
            border-radius: 17px;
            display: grid;
            place-items: center;
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.09);
            margin-bottom: 13px;
        }

        .empty-icon svg {
            width: 24px;
            opacity: .7;
        }

        .empty-state strong {
            color: #eaf3ff;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .empty-state span {
            font-size: 10px;
            max-width: 350px;
        }

        .btn {
            border: 1px solid rgba(255,255,255,.14);
            background:
                linear-gradient(
                    135deg,
                    rgba(42,153,255,.78),
                    rgba(29,84,190,.75)
                );
            color: white;
            padding: 10px 15px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            box-shadow:
                0 8px 25px rgba(0,90,220,.18),
                inset 0 1px 0 rgba(255,255,255,.18);
            transition: .2s;
        }

        .btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn svg {
            width: 15px;
        }

        .btn.secondary {
            background: rgba(255,255,255,.07);
            box-shadow: none;
        }

        .btn.danger {
            background: rgba(255,75,103,.13);
            border-color: rgba(255,75,103,.2);
            color: #ff9aaa;
        }

        .btn.success {
            background: rgba(43,207,141,.13);
            border-color: rgba(43,207,141,.2);
            color: #7df0bd;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 18px;
        }

        .page-header h2 {
            font-size: 20px;
        }

        .page-header p {
            color: var(--muted);
            font-size: 11px;
            margin-top: 3px;
        }

        .page-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 13px;
            background: rgba(255,255,255,.055);
            border: 1px solid var(--border);
            border-radius: 13px;
            margin-bottom: 15px;
        }

        .search-bar svg {
            width: 17px;
            color: #8da6bf;
        }

        .search-bar input {
            flex: 1;
            background: transparent;
            border: 0;
            outline: none;
            color: white;
            font-family: inherit;
            font-size: 11px;
        }

        .search-bar input::placeholder {
            color: #71859b;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 17px;
            border: 1px solid rgba(255,255,255,.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th {
            background: rgba(0,0,0,.14);
            color: #8fa7c0;
            font-size: 10px;
            font-weight: 600;
            padding: 13px;
            text-align: right;
            white-space: nowrap;
        }

        td {
            padding: 13px;
            border-top: 1px solid rgba(255,255,255,.055);
            color: #dbe8f6;
            font-size: 10px;
        }

        tr:hover td {
            background: rgba(255,255,255,.025);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 9px;
            border-radius: 30px;
            font-size: 8px;
            font-weight: 700;
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.09);
        }

        .badge::before {
            content: "";
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
        }

        .badge.green {
            color: #62e9ac;
        }

        .badge.orange {
            color: #ffc66e;
        }

        .badge.red {
            color: #ff8193;
        }

        .badge.blue {
            color: #69c1ff;
        }

        .badge.gray {
            color: #9aafc3;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            color: #c3d2e3;
            font-size: 10px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            background:
                linear-gradient(
                    145deg,
                    rgba(0,12,35,.34),
                    rgba(255,255,255,.035)
                );
            border: 1px solid rgba(255,255,255,.11);
            color: white;
            border-radius: 12px;
            padding: 11px 12px;
            outline: none;
            font-family: inherit;
            font-size: 11px;
            transition: .2s;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-group select option {
            background: #071a38;
            color: white;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: rgba(57,169,255,.55);
            box-shadow:
                0 0 0 3px rgba(46,156,255,.08),
                0 0 25px rgba(30,139,255,.08);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-start;
            gap: 8px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,7,22,.62);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: min(760px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background:
                linear-gradient(
                    145deg,
                    rgba(15,49,88,.96),
                    rgba(5,21,49,.97)
                );
            border: 1px solid var(--border-light);
            border-radius: 24px;
            box-shadow:
                0 35px 100px rgba(0,0,0,.55),
                inset 0 1px 0 rgba(255,255,255,.12);
            padding: 24px;
            animation: modalIn .25s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform:
                    translateY(12px)
                    scale(.98);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 16px;
        }

        .close-modal {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,.05);
            color: white;
            cursor: pointer;
            display: grid;
            place-items: center;
        }

        .workspace-header {
            padding: 20px;
            margin-bottom: 16px;
        }

        .workspace-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .workspace-info h2 {
            font-size: 18px;
        }

        .workspace-info p {
            color: var(--muted);
            font-size: 10px;
            margin-top: 4px;
        }

        .progress {
            width: 220px;
            height: 7px;
            background: rgba(255,255,255,.08);
            border-radius: 20px;
            overflow: hidden;
        }

        .progress span {
            display: block;
            height: 100%;
            background:
                linear-gradient(
                    90deg,
                    var(--blue),
                    var(--cyan)
                );
            border-radius: inherit;
            width: 0%;
            transition: .4s;
        }

        .progress-text {
            font-size: 9px;
            color: var(--muted);
            text-align: left;
            margin-top: 5px;
        }

        .audit-sections {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .audit-section {

                "جارٍ الاتصال بـ Supabase..."
            );

            await restoreSession();

        } catch (error) {

            console.error(
                "INITIALIZATION ERROR:",
                error
            );

            setSystemStatus(
                false,
                "خطأ في التشغيل"
            );
        }
    }
);

/* =========================================================
   SESSION RESTORE
========================================================= */

async function restoreSession() {

    try {

        const {
            data,
            error
        } =
            await supabaseClient.auth.getSession();

        if (error) {

            console.error(
                "GET SESSION ERROR:",
                error
            );

            setSystemStatus(
                false,
                "فشل الاتصال"
            );

            return;
        }

        if (
            !data?.session?.user
        ) {

            setSystemStatus(
                true,
                "بانتظار تسجيل الدخول"
            );

            return;
        }

        await completeAuditorLogin(
            data.session.user
        );

    } catch (error) {

        console.error(
            "RESTORE SESSION ERROR:",
            error
        );

        setSystemStatus(
            false,
            "خطأ في الجلسة"
        );
    }
}


/* =========================================================
   LOGIN
========================================================= */

async function handleLogin(
    event
) {

    event.preventDefault();

    const emailElement =
        document.getElementById(
            "loginEmail"
        );

    const passwordElement =
        document.getElementById(
            "loginPassword"
        );

    const loginButton =
        document.getElementById(
            "loginButton"
        );

    const email =
        emailElement?.value
            ?.trim()
            ?.toLowerCase() || "";

    const password =
        passwordElement?.value || "";

    if (
        !email ||
        !password
    ) {

        showToast(
            "بيانات ناقصة",
            "أدخلي البريد الإلكتروني وكلمة المرور."
        );

        return;
    }

    if (
        !SUPABASE_KEY ||
        SUPABASE_KEY ===
            "ضعي_هنا_PUBLISHABLE_KEY"
    ) {

        showToast(
            "إعداد ناقص",
            "ضعي Publishable Key في الكود أولًا."
        );

        return;
    }

    try {

        if (loginButton) {

            loginButton.disabled =
                true;

            const span =
                loginButton.querySelector(
                    "span"
                );

            if (span) {

                span.textContent =
                    "جارٍ التحقق...";
            }
        }

        setSystemStatus(
            true,
            "جارٍ تسجيل الدخول..."
        );

        const {
            data,
            error
        } =
            await supabaseClient.auth.signInWithPassword({
                email,
                password
            });

        console.log(
            "LOGIN RESPONSE:",
            data,
            error
        );

        if (error) {

            console.error(
                "LOGIN ERROR FULL:",
                error
            );

            showToast(
                "فشل تسجيل الدخول",
                error.message ||
                "البريد الإلكتروني أو كلمة المرور غير صحيحة."
            );

            setSystemStatus(
                false,
                "فشل تسجيل الدخول"
            );

            return;
        }

        if (!data?.user) {

            showToast(
                "خطأ",
                "تم تسجيل الدخول ولكن لم يتم العثور على المستخدم."
            );

            return;
        }

        await completeAuditorLogin(
            data.user
        );

    } catch (error) {

        console.error(
            "LOGIN PROCESS ERROR:",
            error
        );

        showToast(
            "خطأ",
            error?.message ||
            "حدث خطأ أثناء تسجيل الدخول."
        );

    } finally {

        if (loginButton) {

            loginButton.disabled =
                false;

            const span =
                loginButton.querySelector(
                    "span"
                );

            if (span) {

                span.textContent =
                    "دخول البوابة";
            }
        }
    }
}


/* =========================================================
   AUDITOR ROLE
========================================================= */

async function completeAuditorLogin(
    user
) {

    try {

        if (!user?.id) {

            throw new Error(
                "تعذر تحديد User ID."
            );
        }

        setSystemStatus(
            true,
            "جارٍ التحقق من صلاحيات المدقق..."
        );

        const {
            data: roleData,
            error: roleError
        } =
            await supabaseClient
                .from("user_roles")
                .select("role")
                .eq(
                    "user_id",
                    user.id
                )
                .maybeSingle();

        if (roleError) {

            console.error(
                "ROLE ERROR:",
                roleError
            );

            showToast(
                "تعذر التحقق من الصلاحيات",
                roleError.message
            );

            return false;
        }

        if (
            !roleData ||
            ![
                "auditor",
                "admin"
            ].includes(
                roleData.role
            )
        ) {

            showToast(
                "غير مصرح",
                "هذا الحساب ليس حساب مدقق أو مدير."
            );

            await supabaseClient.auth.signOut();

            return false;
        }

        currentUser =
            user;

        currentRole =
            roleData.role;

        setSystemStatus(
            true,
            currentRole === "admin"
                ? "متصل • مدير"
                : "متصل • مدقق"
        );

        const loginScreen =
            document.getElementById(
                "loginScreen"
            );

        const portalScreen =
            document.getElementById(
                "portalScreen"
            );

        if (loginScreen) {

            loginScreen.classList.add(
                "hidden"
            );
        }

        if (portalScreen) {

            portalScreen.classList.remove(
                "hidden"
            );
        }

        await refreshDatabaseData();

        setupRealtimeUpdates();

        updateCounters();

        navigate(
            "dashboard"
        );

        showToast(
            "مرحبًا بك",
            "تم تسجيل الدخول إلى بيئة التدقيق."
        );

        return true;

    } catch (error) {

        console.error(
            "COMPLETE AUDITOR LOGIN ERROR:",
            error
        );

        showToast(
            "خطأ",
            error?.message ||
            "تعذر فتح بوابة المدقق."
        );

        return false;
    }
}

        updateCounters();

        if (
            currentPage ===
            "dashboard"

            renderDashboard();

        ) {

        }

    } catch (error) {

            error
        );
    }
}

/* =========================================================
   REALTIME
========================================================= */

async function setupRealtimeUpdates() {

    await stopRealtime();

    if (!currentUser?.id) {

        console.warn(
            "REALTIME NOT STARTED: USER MISSING"
        );

        return;
    }

    realtimeChannel =
        supabaseClient
            .channel(
                `audit-portal-live-${currentUser.id}-${Date.now()}`
            )

            /* =================================================
               CLIENTS
            ================================================= */

            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "clients"
                },
                async function (payload) {

                    console.log(
                        "CLIENT REALTIME EVENT:",
                        payload
                    );

                    try {

                        await loadClientsFromSupabase();

                        updateCounters();

                        if (
                            currentPage ===
                            "clients"
                        ) {

                            renderClients();
                        }

                        if (
                            currentPage ===
                            "dashboard"
                        ) {

                            renderDashboard();
                        }

                    } catch (error) {

                        console.error(
                            "CLIENT REALTIME ERROR:",
                            error
                        );
                    }
                }
            )

            /* =================================================
               DOCUMENT REQUESTS
            ================================================= */

            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "document_requests"
                },
                async function (payload) {

                    console.log(
                        "REQUEST REALTIME EVENT:",
                        payload
                    );

                    try {

                        await loadRequestsFromSupabase();

                        updateCounters();

                        if (
                            currentPage ===
                            "requests"
                        ) {

                            renderRequestsPage();
                        }

                        if (
                            currentPage ===
                            "documents"
                        ) {

                            renderDocuments();
                        }

                        if (
                            currentPage ===
                            "dashboard"
                        ) {

                            renderDashboard();
                        }

                        /* ==========================
                           INSERT
                        ========================== */

                        if (
                            payload.eventType ===
                            "INSERT"
                        ) {

                            const client =
                                getClientById(
                                    payload.new?.client_id
                                );

                            const clientName =
                                client?.name ||
                                "أحد العملاء";

                            addLocalNotification(
                                "طلب مستند جديد",
                                `تم إنشاء طلب مستند جديد للعميل ${clientName}.`
                            );

                            showToast(
                                "طلب مستند جديد",
                                `تمت إضافة طلب جديد للعميل ${clientName}.`
                            );
                        }

                        /* ==========================
                           UPDATE
                        ========================== */

                        if (
                            payload.eventType ===
                            "UPDATE"
                        ) {

                            const statusText =
                                getRequestStatusText(
                                    payload.new?.status
                                );

                            const client =
                                getClientById(
                                    payload.new?.client_id
                                );

                            const clientName =
                                client?.name ||
                                "العميل";

                            addLocalNotification(
                                "تحديث طلب مستند",
                                `تم تحديث طلب ${payload.new?.title || "المستند"} للعميل ${clientName} إلى: ${statusText}.`
                            );

                            showToast(
                                "تحديث طلب مستند",
                                `الحالة الحالية: ${statusText}`
                            );
                        }

                        /* ==========================
                           DELETE
                        ========================== */

                        if (
                            payload.eventType ===
                            "DELETE"
                        ) {

                            addLocalNotification(
                                "حذف طلب مستند",
                                "تم حذف أحد طلبات المستندات."
                            );

                            showToast(
                                "حذف طلب",
                                "تم حذف أحد طلبات المستندات."
                            );
                        }

                    } catch (error) {

                        console.error(
                            "REQUEST REALTIME HANDLER ERROR:",
                            error
                        );
                    }
                }
            )

            /* =================================================
               DOCUMENTS
            ================================================= */

            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "documents"
                },
                async function (payload) {

                    console.log(
                        "DOCUMENT REALTIME EVENT:",
                        payload
                    );

                    try {

                        await Promise.all([
                            loadDocumentsFromSupabase(),
                            loadRequestsFromSupabase()
                        ]);

                        updateCounters();

                        if (
                            currentPage ===
                            "documents"
                        ) {

                            renderDocuments();
                        }

                        if (
                            currentPage ===
                            "requests"
                        ) {

                            renderRequestsPage();
                        }

                        if (
                            currentPage ===
                            "dashboard"
                        ) {

                            renderDashboard();
                        }

                        /* ==========================
                           INSERT
                        ========================== */

                        if (
                            payload.eventType ===
                            "INSERT"
                        ) {

                            const client =
                                getClientById(
                                    payload.new?.client_id
                                );

                            const clientName =
                                client?.name ||
                                "أحد العملاء";

                            const fileName =
                                payload.new?.name ||
                                "مستند";

                            addLocalNotification(
                                "مستند جديد",
                                `قام ${clientName} برفع المستند "${fileName}".`
                            );

                            showToast(
                                "📄 مستند جديد",
                                `تم رفع "${fileName}" من ${clientName}.`
                            );
                        }

                        /* ==========================
                           UPDATE
                        ========================== */

                        if (
                            payload.eventType ===
                            "UPDATE"
                        ) {

                            const statusText =
                                getDocumentStatusText(
                                    payload.new?.status
                                );

                            const client =
                                getClientById(
                                    payload.new?.client_id
                                );

                            const clientName =
                                client?.name ||
                                "العميل";

                            const fileName =
                                payload.new?.name ||
                                "المستند";

                            addLocalNotification(
                                "تحديث مستند",
                                `تم تحديث "${fileName}" للعميل ${clientName} إلى حالة: ${statusText}.`
                            );

                            showToast(
                                "تحديث المستند",
                                `أصبحت حالة "${fileName}": ${statusText}`
                            );
                        }

                        /* ==========================
                           DELETE
                        ========================== */

                        if (
                            payload.eventType ===
                            "DELETE"
                        ) {

                            addLocalNotification(
                                "حذف مستند",
                                "تم حذف أحد المستندات من النظام."
                            );

                            showToast(
                                "حذف مستند",
                                "تم حذف أحد المستندات."
                            );
                        }

                    } catch (error) {

                        console.error(
                            "DOCUMENT REALTIME HANDLER ERROR:",
                            error
                        );
                    }
                }
            )

            .subscribe(
                function (
                    status
                ) {

                    console.log(
                        "REALTIME STATUS:",
                        status
                    );

                    if (
                        status ===
                        "SUBSCRIBED"
                    ) {

                        setSystemStatus(
                            true,
                            currentRole === "admin"
                                ? "متصل • مدير • تحديث مباشر"
                                : "متصل • مدقق • تحديث مباشر"
                        );

                        console.log(
                            "✅ REALTIME CONNECTED"
                        );
                    }

                    if (
                        status ===
                        "CHANNEL_ERROR"
                    ) {

                        setSystemStatus(
                            false,
                            "خطأ في التحديث المباشر"
                        );

                        console.error(
                            "❌ REALTIME CHANNEL ERROR"
                        );
                    }

                    if (
                        status ===
                        "TIMED_OUT"
                    ) {

                        setSystemStatus(
                            false,
                            "انتهت مهلة التحديث المباشر"
                        );

                        console.error(
                            "❌ REALTIME TIMED OUT"
                        );
                    }

                    if (
                        status ===
                        "CLOSED"
                    ) {

                        console.warn(
                            "⚠️ REALTIME CLOSED"
                        );
                    }
                }
            );
}


/* =========================================================
   STOP REALTIME
========================================================= */

async function stopRealtime() {

    try {

        if (
            realtimeChannel
        ) {

            await supabaseClient
                .removeChannel(
                    realtimeChannel
                );

            realtimeChannel =
                null;
        }

        console.log(
            "REALTIME CHANNEL STOPPED"
        );

    } catch (error) {

        console.error(
            "STOP REALTIME ERROR:",
            error
        );

        realtimeChannel =
            null;
    }
}

/* =========================================================
   COUNTERS
========================================================= */

function updateCounters() {

    const values = {

        clientsCount:
            dbClients.length,

        engagementsCount:
            localState.engagements.length,

        requestsCount:
            dbRequests.length,

        documentsCount:
            dbDocuments.length,

        transactionsCount:
            localState.transactions.length,

        testsCount:
            localState.tests.length,

        exceptionsCount:
            localState.exceptions.length,

        inquiriesCount:
            localState.inquiries.length
    };

    Object
        .entries(values)
        .forEach(
            function (
                [
                    id,
                    value
                ]
            ) {

                const element =
                    document.getElementById(
                        id
                    );

                if (element) {

                    element.textContent =
                        value;
                }
            }
        );

    const unread =
        localState.notifications.filter(
            item =>
                !item.read
        ).length;

    const badge =
        document.getElementById(
            "notificationBadge"
        );

    if (badge) {

        badge.textContent =
            unread;
    }
}


/* =========================================================
   NAVIGATION
========================================================= */

function setupNavigation() {

    document
        .querySelectorAll(
            ".nav-item[data-page]"
        )
        .forEach(
            function (
                button
            ) {

                button.addEventListener(
                    "click",
                    function () {

                        navigate(
                            button.dataset.page
                        );
                    }
                );
            }
        );
}


function navigate(
    page
) {

    currentPage =
        page;

    document
        .querySelectorAll(
            ".nav-item[data-page]"
        )
        .forEach(
            function (
                item
            ) {

                item.classList.toggle(
                    "active",
                    item.dataset.page ===
                        page
                );
            }
        );

    const info =
        pageInfo[page] ||
        pageInfo.dashboard;

    const title =
        document.getElementById(
            "currentPageTitle"
        );

    const subtitle =
        document.getElementById(
            "currentPageSubtitle"
        );

    if (title) {

        title.textContent =
            info[0];
    }

    if (subtitle) {

        subtitle.textContent =
            info[1];
    }

    renderPage(
        page
    );

    const sidebar =
        document.getElementById(
            "sidebar"
        );

    if (sidebar) {

        sidebar.classList.remove(
            "open"
        );
    }

    lucide.createIcons();
}


function renderPage(
    page
) {

    const pages = {

        dashboard:
            renderDashboard,

        clients:
            renderClients,

        engagements:
            renderEngagements,

        requests:
            renderRequestsPage,

        documents:
            renderDocuments,

        transactions:
            renderTransactions,

        preaudit:
            renderPreAudit,

        workspace:
            renderWorkspace,

        tests:
            renderTests,

        samples:
            renderSamples,

        exceptions:
            renderExceptions,

        inquiries:
            renderInquiries,

        workingpapers:
            renderWorkingPapers,

        analytical:
            renderAnalytical,

        review:
            renderReview,

        reports:
            renderReports,

        archive:
            renderArchive,

        audittrail:
            renderAuditTrail
    };

    (
        pages[page] ||
        renderDashboard
    )();

    lucide.createIcons();
}


/* =========================================================
   DASHBOARD
========================================================= */

function renderDashboard() {

    const content =
        document.getElementById(
            "content"
        );

    if (!content) {
        return;
    }

    const uploaded =
        dbDocuments.filter(
            item =>
                item.status ===
                "uploaded"
        ).length;

    const review =
        dbDocuments.filter(
            item =>
                item.status ===
                "review"
        ).length;

    const accepted =
        dbDocuments.filter(
            item =>
                item.status ===

async function saveSupabaseClient(
    event
) {

    event.preventDefault();

    const form =
        new FormData(
            event.target
        );

    const payload = {

        name:
            String(
                form.get("name") ||
                ""
            ).trim(),

        user_id:
            String(
                form.get("user_id") ||
                ""
            ).trim() ||
            null,

        email:
            String(
                form.get("email") ||
                ""
            ).trim() ||
            null,

        tax_number:
            String(
                form.get("tax_number") ||
                ""
            ).trim() ||
            null,

        activity:
            String(
                form.get("activity") ||
                ""
            ).trim() ||
            null,

        contact:
            String(
                form.get("contact") ||
                ""
            ).trim() ||
            null,

        address:
            String(
                form.get("address") ||
                ""
            ).trim() ||
            null,

        notes:
            String(
                form.get("notes") ||
                ""
            ).trim() ||
            null
    };

    if (!payload.name) {

        showToast(
            "بيانات ناقصة",
            "اكتبي اسم العميل."
        );

        return;
    }

    const {
        data,
        error
    } =
        await supabaseClient
            .from("clients")
            .insert(
                payload
            )
            .select()
            .single();

    if (error) {

        console.error(
            "CLIENT INSERT ERROR:",
            error
        );

        showToast(
            "فشل الحفظ",
            error.message
        );

        return;
    }

    dbClients.unshift(
        data
    );

    updateCounters();

    closeModal();

    showToast(
        "تم الحفظ",
        "تم إنشاء ملف العميل بنجاح."
    );

    navigate(
        "clients"
    );
}

function filterAuditorDocuments(
    value
) {

    const query =
        String(
            value || ""
        )
            .trim()
            .toLowerCase();

    const selectedClientId =
        sessionStorage.getItem(
            "selectedClientId"
        );

    const base =
        selectedClientId

            ? dbDocuments.filter(
                function (
                    doc
                ) {

                    return (
                        String(doc.client_id) ===
                        String(selectedClientId)
                    );
                }
            )

            : dbDocuments;

    const filtered =
        base.filter(
            function (
                doc
            ) {

                const client =
                    getClientById(
                        doc.client_id
                    );

                const request =
                    dbRequests.find(
                        function (
                            req
                        ) {

                            return (
                                String(req.id) ===
                                String(doc.request_id)
                            );
                        }
                    );

                return [

                    doc.name,
                    client?.name,
                    request?.title,
                    doc.status

                ]

                    .filter(Boolean)

                    .join(" ")

                    .toLowerCase()

                    .includes(
                        query
                    );
            }
        );

    renderDocumentsTable(
        filtered
    );
}

/* =========================================================
   SAVE DOCUMENT REVIEW
========================================================= */

async function saveAuditorDocumentReview(
    event,
    documentId
) {

    event.preventDefault();

    const form =
        new FormData(
            event.target
        );

    const status =
        String(
            form.get("status") ||
            ""
        ).trim();

    const auditorNotes =
        String(
            form.get("auditor_notes") ||
            ""
        ).trim();

    if (!status) {

        showToast(
            "الحالة مطلوبة",
            "اختاري حالة المستند."
        );

        return;
    }

    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from("documents")
                .update({

                    status:
                        status,

                    auditor_notes:
                        auditorNotes ||
                        null,

                    updated_at:
                        new Date().toISOString()
                })
                .eq(
                    "id",
                    documentId
                )
                .select()
                .single();

        if (error) {

            console.error(
                "DOCUMENT UPDATE ERROR:",
                error
            );

            showToast(
                "فشل تحديث المستند",
                error.message
            );

            return;
        }

        const index =
            dbDocuments.findIndex(
                item =>
                    String(item.id) ===
                    String(documentId)
            );

        if (index >= 0) {

            dbDocuments[index] =
                data;
        }

        const client =
            getClientById(
                data.client_id
            );

        addLocalNotification(
            "تم تحديث مستند",
            `تمت مراجعة مستند ${client?.name || "العميل"} وتحديث حالته.`
        );

        if (
            data.request_id &&
            [
                "accepted",
                "revision"
            ].includes(
                status
            )
        ) {

            const requestStatus =
                status === "accepted"
                    ? "accepted"
                    : "revision";

            const {
                error:
                    requestUpdateError
            } =
                await supabaseClient
                    .from(
                        "document_requests"
                    )
                    .update({

                        status:
                            requestStatus

                    })
                    .eq(
                        "id",
                        data.request_id
                    )
                    .eq(
                        "client_id",
                        data.client_id
                    );

            if (requestUpdateError) {

                console.error(
                    "REQUEST UPDATE ERROR:",
                    requestUpdateError
                );

                showToast(
                    "تم تحديث المستند",
                    "لكن تعذر تحديث حالة طلب المستند."
                );
            }

            await loadRequestsFromSupabase();
        }

        closeModal();

        toast(
            "تم حفظ المراجعة",
            "تم تحديث حالة المستند وملاحظات المدقق."
        );

        updateCounters();

        renderDocuments();

    } catch (error) {

        console.error(
            "SAVE REVIEW ERROR:",
            error
        );

        showToast(
            "خطأ",
            error?.message ||
            "تعذر حفظ المراجعة."
        );
    }
}


/* =========================================================
   OPEN / DOWNLOAD FILE
========================================================= */

async function downloadAuditorDocument(
    id
) {

    const doc =
        dbDocuments.find(
            item =>
                String(item.id) ===
                String(id)
        );

    if (!doc) {

        showToast(
            "لا يوجد مستند",
            "تعذر العثور على المستند."
        );

        return;
    }

    if (!doc.file_path) {

        showToast(
            "مسار الملف مفقود",
            "السجل موجود لكن file_path فارغ."
        );

        return;
    }

    try {

        showToast(
            "جارٍ فتح الملف",
            "يتم إنشاء رابط آمن للمستند..."
        );

        const {
            data,
            error
        } =
            await supabaseClient
                .storage
                .from(
                    "client-documents"
                )
                .createSignedUrl(
                    doc.file_path,
                    300
                );

        if (error) {

            console.error(
                "SIGNED URL ERROR:",
                error
            );

            showToast(
                "تعذر فتح الملف",
                error.message
            );

            return;
        }

        if (!data?.signedUrl) {

            showToast(
                "تعذر فتح الملف",
                "لم يتم إنشاء الرابط الآمن."
            );

            return;
        }

        const newWindow =
            window.open(
                data.signedUrl,
                "_blank",
                "noopener,noreferrer"
            );

        if (!newWindow) {

            window.location.href =
                data.signedUrl;
        }

    } catch (error) {

        console.error(
            "FILE OPEN ERROR:",
            error
        );

        showToast(
            "خطأ",
            error?.message ||
            "تعذر فتح الملف."
        );
    }
}

/* =========================================================
   LOCAL STATE
========================================================= */

const LOCAL_STATE_KEY =
    "audit_local_workspace_v2";


function loadLocalState() {

    try {

        const saved =
            localStorage.getItem(
                LOCAL_STATE_KEY
            );

        if (!saved) {
            return;
        }

        const parsed =
            JSON.parse(
                saved
            );

        localState = {

            ...localState,

            ...parsed
        };

    } catch (error) {

        console.error(
            "LOCAL STATE ERROR:",
            error
        );
    }
}


function saveLocalState() {

    try {

        localStorage.setItem(
            LOCAL_STATE_KEY,
            JSON.stringify(
                localState
            )
        );

        updateCounters();

    } catch (error) {

        console.error(
            "SAVE LOCAL STATE ERROR:",
            error
        );
    }
}

function addLocalNotification(
    title,
    message
) {

    localState.notifications.unshift({

        id:
            "NOT-" +
            Date.now(),

        title:
            title,

        message:
            message,

        timestamp:
            new Date().toISOString(),

        read:
            false
    });

    localState.notifications =
        localState.notifications.slice(
            0,
            50
        );

    saveLocalState();

    renderNotifications();

    updateCounters();
}


function renderNotifications() {

    const container =
        document.getElementById(
            "notificationList"
        );

    if (!container) {
        return;
    }

    if (
        localState.notifications.length ===
        0
    ) {

        container.innerHTML =
            emptyState(
                "لا توجد إشعارات",
                "ستظهر الإشعارات هنا."
            );

        return;
    }

    container.innerHTML =
        localState.notifications
            .slice(
                0,
                20
            )
            .map(
                function (
                    notification
                ) {

                    return `

                        <div class="notification-item">

                            <strong>
                                ${escapeHTML(
                                    notification.title
                                )}
                            </strong>

                            <p>
                                ${escapeHTML(
                                    notification.message

                            </p>

                            <time>
                                ${formatDateTime(
                                    new Date(
                                        notification.timestamp
                                    )
                                )}
                            </time>

                        </div>
                    `;
                }
            )
            .join("");
}

    const button =

    if (button) {

        button.addEventListener(

                const panel =

function emptyState(

        <div class="empty-state">

function escapeHTML(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";
    }

    return String(
        value
    )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}


function escapeAttribute(
    value
) {

    return escapeHTML(
        value
    );
}


function formatSupabaseDate(
    value
) {

    if (!value) {
        return "—";
    }

    try {

        return new Intl.DateTimeFormat(
            "ar-JO",
            {
                year:
                    "numeric",

                month:
                    "2-digit",

                day:
                    "2-digit",

                hour:
                    "2-digit",

                minute:
                    "2-digit"
            }
        ).format(
            new Date(
                value
            )
        );

    } catch (error) {

        return String(
            value
        );
    }
}


function formatDateTime(
    date = new Date()
) {

    return new Intl.DateTimeFormat(
        "ar-JO",
        {
            year:
                "numeric",

            month:
                "2-digit",

            day:
                "2-digit",

            hour:
                "2-digit",

            minute:
                "2-digit"
        }
    ).format(
        date
    );
}


function formatFileSize(
    bytes
) {

    const value =
        Number(
            bytes || 0
        );

    if (
        value ===
        0
    ) {

        return "0 KB";
    }

    const kb =
        value / 1024;

    if (
        kb <
        1024
    ) {

        return `${kb.toFixed(1)} KB`;
    }

    return `${(
        kb / 1024
    ).toFixed(2)} MB`;
}


/* =========================================================
   TOAST
========================================================= */

function showToast(
    title,
    message
) {

    const container =
        document.getElementById(
            "toastContainer"
        );

    if (!container) {
        return;
    }

    const element =
        document.createElement(
            "div"
        );

    element.className =
        "toast";

    element.innerHTML = `

        <strong>
            ${escapeHTML(title)}
        </strong>

        <p>
            ${escapeHTML(message)}
        </p>

    `;

    container.appendChild(
        element
    );

    setTimeout(
        function () {

            element.style.opacity =
                "0";

            element.style.transform =
                "translateX(-20px)";

            setTimeout(
                function () {

                    element.remove();

                },
                250
            );

        },
        3500
    );
}


function toast(
    title,
    message
) {

    showToast(
        title,
        message
    );
}
