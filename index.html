

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بوابة التدقيق الإلكترونية - المدقق</title>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Lucide -->
<script src="https://unpkg.com/lucide@latest"></script>

<!-- Supabase - تعريف واحد فقط -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Tajawal:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet"
>

<style>

:root {
--bg-1: #020b20;
--bg-2: #061b42;
--bg-3: #083d69;
--glass: rgba(255, 255, 255, .075);
--glass-strong: rgba(255, 255, 255, .11);
--glass-dark: rgba(0, 12, 35, .28);
--border: rgba(255, 255, 255, .16);
--border-light: rgba(255, 255, 255, .24);
--white: #ffffff;
--text: #f4f8ff;
--muted: #aabbd0;
--blue: #329cff;
--cyan: #38d9ff;
--green: #36d996;
--orange: #ffb454;
--red: #ff647c;
--yellow: #f5d76e;
--shadow: 0 25px 70px rgba(0,0,0,.35),
inset 0 1px 0 rgba(255,255,255,.08);
--radius: 22px;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: 'Tajawal', 'Cairo', sans-serif;
}

html {
scroll-behavior: smooth;
}

body {
min-height: 100vh;
color: var(--text);
background:
radial-gradient(circle at 15% 20%, rgba(0, 180, 216, 0.14), transparent 25%),
radial-gradient(circle at 85% 75%, rgba(0, 129, 167, 0.18), transparent 30%),
linear-gradient(
135deg,
#020617 0%,
#03254c 35%,
#004b6e 70%,
#0081a7 100%
);
background-attachment: fixed;
overflow-x: hidden;
}

.glass-panel {
background: rgba(255, 255, 255, 0.08);
backdrop-filter: blur(25px);
-webkit-backdrop-filter: blur(25px);
border: 1px solid rgba(255, 255, 255, 0.18);
box-shadow:
0 12px 40px rgba(0, 0, 0, 0.37),
inset 0 0 15px rgba(255, 255, 255, 0.05);
}

.glass-input {
background: rgba(0, 0, 0, 0.25);
border: 1px solid rgba(255, 255, 255, 0.2);
color: #ffffff;
transition: all 0.3s ease;
}

.glass-input:focus {
outline: none;
border-color: #38bdf8;
background: rgba(0, 0, 0, 0.4);
box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
}

.aqua-glow-btn {
background:
linear-gradient(
135deg,
#0077b6 0%,
#00b4d8 100%
);
box-shadow:
0 8px 25px -4px rgba(0, 180, 216, 0.5);
transition: all 0.3s ease;
}

.aqua-glow-btn:hover {
transform: translateY(-2px);
box-shadow:
0 12px 30px -4px rgba(0, 180, 216, 0.7);
background:
linear-gradient(
135deg,
#0096c7 0%,
#48cae4 100%
);
}

.background {
position: fixed;
inset: 0;
z-index: -5;
overflow: hidden;
pointer-events: none;
}

.grid-bg {
position: absolute;
inset: 0;
opacity: .16;
background-image:
linear-gradient(
rgba(255,255,255,.04) 1px,
transparent 1px
),
linear-gradient(
90deg,
rgba(255,255,255,.04) 1px,
transparent 1px
);
background-size: 55px 55px;
mask-image:
linear-gradient(
to bottom,
black,
transparent
);
}

.orb {
position: absolute;
border-radius: 50%;
filter: blur(60px);
opacity: .35;
animation:
floatOrb
14s
ease-in-out
infinite
alternate;
}

.orb.one {
width: 360px;
height: 360px;
background: #0a8cff;
top: -100px;
left: -80px;
}

.orb.two {
width: 300px;
height: 300px;
background: #18d8ff;
right: 8%;
top: 10%;
animation-delay: 2s;
}

.orb.three {
width: 420px;
height: 420px;
background: #1642bd;
bottom: -180px;
left: 30%;
animation-delay: 4s;
}

.orb.four {
width: 220px;
height: 220px;
background: #2be4d0;
right: -70px;
bottom: 20%;
animation-delay: 6s;
}

@keyframes floatOrb {
from {
transform:
translate3d(0,0,0)
scale(1);
}

to {
transform:
translate3d(30px,-25px,0)
scale(1.08);
}
}

.app {
display: flex;
min-height: 100vh;
gap: 18px;
padding: 18px;
}

.sidebar {
width: 270px;
flex-shrink: 0;
min-height: calc(100vh - 36px);
background:
linear-gradient(
145deg,
rgba(255,255,255,.10),
rgba(255,255,255,.035)
);
backdrop-filter: blur(28px);
-webkit-backdrop-filter: blur(28px);
border: 1px solid var(--border);
border-radius: 28px;
box-shadow: var(--shadow);
padding: 22px 14px;
display: flex;
flex-direction: column;
position: sticky;
top: 18px;
height: calc(100vh - 36px);
}

.brand {
display: flex;
align-items: center;
gap: 12px;
padding: 8px 10px 24px;
border-bottom: 1px solid rgba(255,255,255,.08);
margin-bottom: 15px;
}

.brand-icon {
width: 48px;
height: 48px;
border-radius: 15px;
display: grid;
place-items: center;
background:
linear-gradient(
135deg,
rgba(49,160,255,.85),
rgba(22,83,196,.55)
);
border: 1px solid rgba(255,255,255,.2);
box-shadow:
0 8px 25px rgba(0,130,255,.25),
inset 0 1px 0 rgba(255,255,255,.25);
}

.brand-icon svg {
width: 26px;
}

.brand-title {
font-weight: 800;
font-size: 15px;
}

.brand-sub {
color: var(--muted);
font-size: 10px;
margin-top: 2px;
}

.nav {
overflow-y: auto;
padding-right: 2px;
flex: 1;
}

.nav-section {
color: #7f96b1;
font-size: 10px;
font-weight: 700;
padding: 15px 13px 7px;
}

.nav-item {
width: 100%;
border: 0;
background: transparent;
color: #b9c9dc;
display: flex;
align-items: center;
gap: 11px;
padding: 11px 13px;
border-radius: 14px;
cursor: pointer;
font-family: inherit;
font-size: 12px;
transition: .25s ease;
text-align: right;
}

.nav-item svg {
width: 18px;
height: 18px;
flex-shrink: 0;
}

.nav-item:hover {
background: rgba(255,255,255,.07);
color: white;
}

.nav-item.active {
background:
linear-gradient(
135deg,
rgba(42,154,255,.25),
rgba(42,90,210,.12)
);
color: white;
border: 1px solid rgba(77,174,255,.18);
box-shadow:
inset 0 1px 0 rgba(255,255,255,.08),
0 8px 25px rgba(0,100,255,.08);
}

.nav-count {
margin-right: auto;
background: rgba(255,255,255,.08);
padding: 2px 7px;
border-radius: 20px;
font-size: 9px;
color: #aac2da;
}

.sidebar-footer {
margin-top: auto;
padding-top: 15px;
border-top: 1px solid rgba(255,255,255,.08);
}

.system-status {
padding: 12px;
border-radius: 15px;
background: rgba(0,0,0,.14);
border: 1px solid rgba(255,255,255,.07);
}

.status-row {
display: flex;
align-items: center;
gap: 7px;
font-size: 10px;
color: var(--muted);
}

.status-dot {
width: 7px;
height: 7px;
border-radius: 50%;
background: var(--green);
box-shadow:
0 0 10px var(--green);
}

.main {
flex: 1;
min-width: 0;
}

.topbar {
height: 72px;
margin-bottom: 18px;
display: flex;
align-items: center;
justify-content: space-between;
gap: 15px;
padding: 12px 17px;
border-radius: 22px;
background: rgba(255,255,255,.065);
backdrop-filter: blur(25px);
-webkit-backdrop-filter: blur(25px);
border: 1px solid var(--border);
box-shadow: var(--shadow);
}

.page-title {
display: flex;
align-items: center;
gap: 12px;
}

.page-title h1 {
font-size: 18px;
font-weight: 800;
}

.page-title p {
font-size: 10px;
color: var(--muted);
}

.top-actions {
display: flex;
align-items: center;
gap: 9px;
}

.icon-button {
width: 40px;
height: 40px;
border-radius: 13px;
display: grid;
place-items: center;
border: 1px solid var(--border);
background: rgba(255,255,255,.06);
color: white;
cursor: pointer;
transition: .2s;
position: relative;
}

.icon-button:hover {
background: rgba(255,255,255,.11);
transform: translateY(-1px);
}

.icon-button svg {
width: 18px;
}

.notification-badge {
position: absolute;
top: -3px;
right: -3px;
min-width: 16px;
height: 16px;
padding: 0 4px;
display: grid;
place-items: center;
border-radius: 20px;
background: var(--red);
color: white;
font-size: 8px;
border: 2px solid #061b42;
}

.content {
animation: fadeIn .35s ease;
}

@keyframes fadeIn {
from {
opacity: 0;
transform: translateY(7px);
}

to {
opacity: 1;
transform: none;
}
}

.glass {
background:
linear-gradient(
145deg,
rgba(255,255,255,.105),
rgba(255,255,255,.035)
);
backdrop-filter: blur(25px);
-webkit-backdrop-filter: blur(25px);
border: 1px solid var(--border);
box-shadow: var(--shadow);
border-radius: var(--radius);
}

.welcome {
padding: 28px;
margin-bottom: 18px;
position: relative;
overflow: hidden;
}

.welcome::after {
content: "";
position: absolute;
width: 260px;
height: 260px;
border-radius: 50%;
background: rgba(40,172,255,.13);
filter: blur(30px);
left: -100px;
top: -120px;
}

.welcome-content {
position: relative;
z-index: 1;
}

.eyebrow {
color: #72c7ff;
font-size: 10px;
font-weight: 700;
margin-bottom: 7px;
}

.welcome h2 {
font-size: 25px;
margin-bottom: 7px;
}

.welcome p {
color: var(--muted);
font-size: 12px;
max-width: 700px;
}

.stats-grid {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 14px;
margin-bottom: 18px;
}

.stat-card {
padding: 18px;
min-height: 130px;
position: relative;
overflow: hidden;
}

.stat-card::before {
content: "";
position: absolute;
width: 100px;
height: 100px;
border-radius: 50%;
background: rgba(50,156,255,.09);
filter: blur(25px);
left: -30px;
bottom: -30px;
}

.stat-top {
display: flex;
justify-content: space-between;
align-items: center;
}

.stat-icon {
width: 39px;
height: 39px;
border-radius: 12px;
display: grid;
place-items: center;
background: rgba(48,155,255,.12);
border: 1px solid rgba(48,155,255,.17);
}

.stat-icon svg {
width: 19px;
}

.stat-label {
font-size: 10px;
color: var(--muted);
}

.stat-value {
margin-top: 15px;
font-size: 24px;
font-weight: 800;
}

.dashboard-grid {
display: grid;
grid-template-columns: 1.35fr .85fr;
gap: 18px;
}

.panel {
padding: 20px;
}

.panel-header {
display: flex;
align-items: center;
justify-content: space-between;
gap: 10px;
margin-bottom: 17px;
}

.panel-title {
font-size: 14px;
font-weight: 700;
}

.panel-sub {
color: var(--muted);
font-size: 10px;
margin-top: 2px;
}

.empty-state {
min-height: 190px;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
text-align: center;
color: var(--muted);
padding: 25px;
}

.empty-icon {
width: 52px;
height: 52px;
border-radius: 17px;
display: grid;
place-items: center;
background: rgba(255,255,255,.05);
border: 1px solid rgba(255,255,255,.09);
margin-bottom: 13px;
}

.empty-icon svg {
width: 24px;
opacity: .7;
}

.empty-state strong {
color: #eaf3ff;
font-size: 12px;
margin-bottom: 5px;
}

.empty-state span {
font-size: 10px;
max-width: 350px;
}

.btn {
border: 1px solid rgba(255,255,255,.14);
background:
linear-gradient(
135deg,
rgba(42,153,255,.78),
rgba(29,84,190,.75)
);
color: white;
padding: 10px 15px;
border-radius: 12px;
font-family: inherit;
font-size: 11px;
font-weight: 700;
cursor: pointer;
display: inline-flex;
align-items: center;
justify-content: center;
gap: 7px;
box-shadow:
0 8px 25px rgba(0,90,220,.18),
inset 0 1px 0 rgba(255,255,255,.18);
transition: .2s;
}

.btn:hover {
transform: translateY(-1px);
filter: brightness(1.08);
}

.btn:active {
transform: translateY(1px);
}

.btn svg {
width: 15px;
}

.btn.secondary {
background: rgba(255,255,255,.07);
box-shadow: none;
}

.btn.danger {
background: rgba(255,75,103,.13);
border-color: rgba(255,75,103,.2);
color: #ff9aaa;
}

.btn.success {
background: rgba(43,207,141,.13);
border-color: rgba(43,207,141,.2);
color: #7df0bd;
}

.page-header {
display: flex;
align-items: center;
justify-content: space-between;
gap: 15px;
margin-bottom: 18px;
}

.page-header h2 {
font-size: 20px;
}

.page-header p {
color: var(--muted);
font-size: 11px;
margin-top: 3px;
}

.page-actions {
display: flex;
gap: 8px;
flex-wrap: wrap;
}

.search-bar {
display: flex;
align-items: center;
gap: 8px;
padding: 10px 13px;
background: rgba(255,255,255,.055);
border: 1px solid var(--border);
border-radius: 13px;
margin-bottom: 15px;
}

.search-bar svg {
width: 17px;
color: #8da6bf;
}

.search-bar input {
flex: 1;
background: transparent;
border: 0;
outline: none;
color: white;
font-family: inherit;
font-size: 11px;
}

.search-bar input::placeholder {
color: #71859b;
}

.table-wrapper {
overflow-x: auto;
border-radius: 17px;
border: 1px solid rgba(255,255,255,.08);
}

table {
width: 100%;
border-collapse: collapse;
min-width: 850px;
}

th {
background: rgba(0,0,0,.14);
color: #8fa7c0;
font-size: 10px;
font-weight: 600;
padding: 13px;
text-align: right;
white-space: nowrap;
}

td {
padding: 13px;
border-top: 1px solid rgba(255,255,255,.055);
color: #dbe8f6;
font-size: 10px;
}

tr:hover td {
background: rgba(255,255,255,.025);
}

.badge {
display: inline-flex;
align-items: center;
gap: 5px;
padding: 4px 9px;
border-radius: 30px;
font-size: 8px;
font-weight: 700;
background: rgba(255,255,255,.07);
border: 1px solid rgba(255,255,255,.09);
}

.badge::before {
content: "";
width: 5px;
height: 5px;
border-radius: 50%;
background: currentColor;
}

.badge.green {
color: #62e9ac;
}

.badge.orange {
color: #ffc66e;
}

.badge.red {
color: #ff8193;
}

.badge.blue {
color: #69c1ff;
}

.badge.gray {
color: #9aafc3;
}

.form-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 14px;
}

.form-group {
display: flex;
flex-direction: column;
gap: 7px;
}

.form-group.full {
grid-column: 1 / -1;
}

.form-group label {
color: #c3d2e3;
font-size: 10px;
}

.form-group input,
.form-group select,
.form-group textarea {
width: 100%;
background:
linear-gradient(
145deg,
rgba(0,12,35,.34),
rgba(255,255,255,.035)
);
border: 1px solid rgba(255,255,255,.11);
color: white;
border-radius: 12px;
padding: 11px 12px;
outline: none;
font-family: inherit;
font-size: 11px;
transition: .2s;
}

.form-group textarea {
min-height: 100px;
resize: vertical;
}

.form-group select option {
background: #071a38;
color: white;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
border-color: rgba(57,169,255,.55);
box-shadow:
0 0 0 3px rgba(46,156,255,.08),
0 0 25px rgba(30,139,255,.08);
}

.modal-actions {
display: flex;
justify-content: flex-start;
gap: 8px;
margin-top: 20px;
flex-wrap: wrap;
}

.modal-overlay {
position: fixed;
inset: 0;
background: rgba(0,7,22,.62);
backdrop-filter: blur(10px);
-webkit-backdrop-filter: blur(10px);
display: none;
align-items: center;
justify-content: center;
z-index: 1000;
padding: 20px;
}

.modal-overlay.show {
display: flex;
}

.modal {
width: min(760px, 100%);
max-height: 90vh;
overflow-y: auto;
background:
linear-gradient(
145deg,
rgba(15,49,88,.96),
rgba(5,21,49,.97)
);
border: 1px solid var(--border-light);
border-radius: 24px;
box-shadow:
0 35px 100px rgba(0,0,0,.55),
inset 0 1px 0 rgba(255,255,255,.12);
padding: 24px;
animation: modalIn .25s ease;
}

@keyframes modalIn {
from {
opacity: 0;
transform:
translateY(12px)
scale(.98);
}

to {
opacity: 1;
transform: none;
}
}

.modal-header {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 20px;
}

.modal-header h3 {
font-size: 16px;
}

.close-modal {
width: 34px;
height: 34px;
border-radius: 10px;
border: 1px solid var(--border);
background: rgba(255,255,255,.05);
color: white;
cursor: pointer;
display: grid;
place-items: center;
}

.workspace-header {
padding: 20px;
margin-bottom: 16px;
}

.workspace-info {
display: flex;
justify-content: space-between;
align-items: center;
gap: 20px;
}

.workspace-info h2 {
font-size: 18px;
}

.workspace-info p {
color: var(--muted);
font-size: 10px;
margin-top: 4px;
}

.progress {
width: 220px;
height: 7px;
background: rgba(255,255,255,.08);
border-radius: 20px;
overflow: hidden;
}

.progress span {
display: block;
height: 100%;
background:
linear-gradient(
90deg,
var(--blue),
var(--cyan)
);
border-radius: inherit;
width: 0%;
transition: .4s;
}

.progress-text {
font-size: 9px;
color: var(--muted);
text-align: left;
margin-top: 5px;
}

.audit-sections {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 12px;
}

.audit-section {
padding: 15px;
cursor: pointer;
transition: .2s;
}

.audit-section:hover {
transform: translateY(-2px);
background: rgba(255,255,255,.09);
}

.audit-section-icon {
width: 38px;
height: 38px;
border-radius: 12px;
display: grid;
place-items: center;
background: rgba(49,156,255,.1);
border: 1px solid rgba(49,156,255,.15);
margin-bottom: 12px;
}

.audit-section-icon svg {
width: 18px;
}

.audit-section strong {
font-size: 11px;
}

.audit-section small {
display: block;
color: var(--muted);
font-size: 8px;
margin-top: 4px;
}

.timeline {
display: flex;
flex-direction: column;
}

.timeline-item {
display: flex;
gap: 14px;
position: relative;
padding-bottom: 18px;
}

.timeline-item:not(:last-child)::before {
content: "";
position: absolute;
right: 9px;
top: 22px;
bottom: 0;
width: 1px;
background: rgba(255,255,255,.1);
}

.timeline-dot {
width: 19px;
height: 19px;
flex-shrink: 0;
border-radius: 50%;
background: rgba(55,162,255,.2);
border: 1px solid rgba(75,180,255,.35);
position: relative;
z-index: 1;
}

.timeline-content {
flex: 1;
}

.timeline-content strong {
font-size: 10px;
}

.timeline-content p {
color: var(--muted);
font-size: 9px;
margin-top: 3px;
}

.timeline-time {
color: #718ba6;
font-size: 8px;
}

.notification-panel {
position: fixed;
top: 82px;
left: 28px;
width: 340px;
max-width: calc(100vw - 40px);
background:
linear-gradient(
145deg,
rgba(13,43,78,.96),
rgba(3,18,42,.97)
);
border: 1px solid var(--border);
border-radius: 20px;
box-shadow: 0 30px 80px rgba(0,0,0,.45);
z-index: 800;
display: none;
overflow: hidden;
}

.notification-panel.show {
display: block;
}

.message-panel {
position: fixed;
top: 82px;
left: 28px;
width: 380px;
max-width: calc(100vw - 40px);
background:
linear-gradient(145deg, rgba(13,43,78,.96), rgba(3,18,42,.97));
border: 1px solid var(--border);
border-radius: 20px;
box-shadow: 0 30px 80px rgba(0,0,0,.45);
z-index: 801;
display: none;
overflow: hidden;
}

.message-panel.show {

<script>
/* =========================================================

========================================================= */

const SUPABASE_URL =
"https://wwybebjrddamormylzem.supabase.co";

const SUPABASE_KEY =
"sb_publishable_r6Pl1Cr0_wypoL1H93lt_g_-BBj_6_u";

if (
!SUPABASE_KEY ||
SUPABASE_KEY === "ضعي_هنا_PUBLISHABLE_KEY"
) {
console.warn(
"Supabase Publishable Key is missing."
);
}


/* =========================================================
SUPABASE CLIENT
========================================================= */

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================================
APPLICATION STATE
========================================================= */

let currentUser = null;
let currentRole = null;
let currentPage = "dashboard";

let dbClients = [];
let dbRequests = [];
let dbDocuments = [];

let localState = {
engagements: [],
tests: [],
exceptions: [],
reports: [],
archive: [],
auditTrail: [],
notifications: [],
inquiryMessages: []
};

let realtimeChannel = null;


/* =========================================================
PAGE INFORMATION
========================================================= */

const pageInfo = {

dashboard: [
"لوحة التحكم",
"نظرة عامة على بيئة التدقيق"
],

clients: [
"العملاء",
"إدارة بيانات العملاء"
],

engagements: [
"مهام التدقيق",
"إنشاء وإدارة مهام التدقيق"
],

requests: [
"طلبات المستندات",
"إرسال ومتابعة طلبات المستندات"
],

documents: [
"المستندات",
"إدارة المستندات المرفوعة ومراجعتها"
],

tests: [
"الاختبارات",
"إجراءات واختبارات التدقيق"
],

exceptions: [
"الاستثناءات",
"إدارة الاستثناءات والمخاطر"
],

reports: [
"التقارير",
"إعداد وإدارة تقارير التدقيق"
],

archive: [
"الأرشيف",
"الملفات المغلقة والمؤرشفة"
],


preaudit: [
"الفحص الآلي",
"الفحص الأولي والاستثناءات الآلية"
],

clientmessages: [
"رسائل العملاء",
"محادثات واستفسارات العملاء"
],

audittrail: [
"سجل التدقيق",
"سجل العمليات والتغييرات"
]
};


/* =========================================================
INITIALIZATION
========================================================= */

document.addEventListener(
"DOMContentLoaded",
async function () {

try {

lucide.createIcons();

loadLocalState();

setupNavigation();
setupModalEvents();
setupNotificationEvents();
setupMobileMenu();

updateCounters();
renderNotifications();

if (
!SUPABASE_KEY ||
SUPABASE_KEY ===
"ضعي_هنا_PUBLISHABLE_KEY"
) {

setSystemStatus(
false,
"Publishable Key غير موجود"
);

showToast(
"إعداد ناقص",
"ضعي Publishable Key الصحيح في الكود."
);

return;
}

setSystemStatus(
true,
"جارٍ الاتصال بـ Supabase..."
);

await restoreSession();

} catch (error) {

console.error(
"INITIALIZATION ERROR:",
error
);

setSystemStatus(
false,
"خطأ في التشغيل"
);
}
}
);


/* =========================================================
SYSTEM STATUS
========================================================= */

function setSystemStatus(
online,
text
) {

const element =
document.getElementById(
"systemStatusText"
);

if (element) {

element.textContent =
text;

element.style.color =
online
? ""
: "#ff8193";
}
}


/* =========================================================
SESSION RESTORE
========================================================= */

async function restoreSession() {

try {

const {
data,
error
} =
await supabaseClient.auth.getSession();

if (error) {

console.error(
"GET SESSION ERROR:",
error
);

setSystemStatus(
false,
"فشل الاتصال"
);

return;
}

if (
!data?.session?.user
) {

setSystemStatus(
true,
"بانتظار تسجيل الدخول"
);

return;
}

await completeAuditorLogin(
data.session.user
);

} catch (error) {

console.error(
"RESTORE SESSION ERROR:",
error
);

setSystemStatus(
false,
"خطأ في الجلسة"
);
}
}


/* =========================================================
LOGIN
========================================================= */

async function handleLogin(
event
) {

event.preventDefault();

const emailElement =
document.getElementById(
"loginEmail"
);

const passwordElement =
document.getElementById(
"loginPassword"
);

const loginButton =
document.getElementById(
"loginButton"
);

const email =
emailElement?.value
?.trim()
?.toLowerCase() || "";

const password =
passwordElement?.value || "";

if (
!email ||
!password
) {

showToast(
"بيانات ناقصة",
"أدخلي البريد الإلكتروني وكلمة المرور."
);

return;
}

if (
!SUPABASE_KEY ||
SUPABASE_KEY ===
"ضعي_هنا_PUBLISHABLE_KEY"
) {

showToast(
"إعداد ناقص",
"ضعي Publishable Key في الكود أولًا."
);

return;
}

try {

if (loginButton) {

loginButton.disabled =
true;

const span =
loginButton.querySelector(
"span"
);

if (span) {

span.textContent =
"جارٍ التحقق...";
}
}

setSystemStatus(
true,
"جارٍ تسجيل الدخول..."
);

const {
data,
error
} =
await supabaseClient.auth.signInWithPassword({
email,
password
});

console.log(
"LOGIN RESPONSE:",
data,
error
);

if (error) {

console.error(
"LOGIN ERROR FULL:",
error
);

showToast(
"فشل تسجيل الدخول",
error.message ||
"البريد الإلكتروني أو كلمة المرور غير صحيحة."
);

setSystemStatus(
false,
"فشل تسجيل الدخول"
);

return;
}

if (!data?.user) {

showToast(
"خطأ",
"تم تسجيل الدخول ولكن لم يتم العثور على المستخدم."
);

return;
}

await completeAuditorLogin(
data.user
);

} catch (error) {

console.error(
"LOGIN PROCESS ERROR:",
error
);

showToast(
"خطأ",
error?.message ||
"حدث خطأ أثناء تسجيل الدخول."
);

} finally {

if (loginButton) {

loginButton.disabled =
false;

const span =
loginButton.querySelector(
"span"
);

if (span) {

span.textContent =
"دخول البوابة";
}
}
}
}


/* =========================================================
AUDITOR ROLE
========================================================= */

async function completeAuditorLogin(
user
) {

try {

if (!user?.id) {

throw new Error(
"تعذر تحديد User ID."
);
}

setSystemStatus(
true,
"جارٍ التحقق من صلاحيات المدقق..."
);

const {
data: roleData,
error: roleError
} =
await supabaseClient
.from("user_roles")
.select("role")
.eq(
"user_id",
user.id
)
.maybeSingle();

if (roleError) {

console.error(
"ROLE ERROR:",
roleError
);

showToast(
"تعذر التحقق من الصلاحيات",
roleError.message
);

return false;
}

if (
!roleData ||
![
"auditor",
"admin"
].includes(
roleData.role
)
) {

showToast(
"غير مصرح",
"هذا الحساب ليس حساب مدقق أو مدير."
);

await supabaseClient.auth.signOut();

return false;
}

currentUser =
user;

currentRole =
roleData.role;

setSystemStatus(
true,
currentRole === "admin"
? "متصل • مدير"
: "متصل • مدقق"
);

const loginScreen =
document.getElementById(
"loginScreen"
);

const portalScreen =
document.getElementById(
"portalScreen"
);

if (loginScreen) {

loginScreen.classList.add(
"hidden"
);
}

if (portalScreen) {

portalScreen.classList.remove(
"hidden"
);
}

await refreshDatabaseData();

setupRealtimeUpdates();

updateCounters();

/* =========================================================

function updateCounters() {

const values = {

clientsCount:
dbClients.length,

engagementsCount:
localState.engagements.length,

requestsCount:
dbRequests.length,

documentsCount:
dbDocuments.length,

testsCount:
localState.tests.length,

exceptionsCount:
localState.exceptions.length,

};

Object
.entries(values)
.forEach(
function (
[
id,
value
]
) {

const element =
document.getElementById(
id
);

if (element) {

element.textContent =
value;
}
}
);

const unread =
(Array.isArray(localState.notifications)
? localState.notifications
: []
).filter(
item => !item.read
).length;

const unreadClientMessages =
(localState.inquiryMessages || [])
.filter(
item =>
item.sender === "client" &&
!item.read
)
.length;

const messagesBadge =
document.getElementById(
"clientMessagesCount"
);

if (messagesBadge) {
messagesBadge.textContent =
unreadClientMessages;
}

const badge =
document.getElementById(
"notificationBadge"
);

if (badge) {

badge.textContent =
unread;
}
}

/*
توليد كلمة مرور مؤقتة قوية تلقائيًا
باستخدام Web Crypto API
*/
function generateSecurePassword(length = 18) {

const lower =
"abcdefghijkmnopqrstuvwxyz";

const upper =
"ABCDEFGHJKLMNPQRSTUVWXYZ";

const numbers =
"23456789";

const symbols =
"!@#$%^&*_-+=";

const all =
lower +
upper +
numbers +
symbols;

const randomBytes =
new Uint32Array(length);

crypto.getRandomValues(
randomBytes
);

const passwordChars = [
lower[randomBytes[0] % lower.length],
upper[randomBytes[1] % upper.length],
numbers[randomBytes[2] % numbers.length],
symbols[randomBytes[3] % symbols.length]
];

for (
let i = 4;
i < length;
i++
) {

passwordChars.push(
all[randomBytes[i] % all.length]
);
}

/*
خلط بسيط حتى لا تكون أول 4 محارف دائمًا بنفس الترتيب
*/
for (
let i = passwordChars.length - 1;
i > 0;
i--
) {

const j =
randomBytes[i % randomBytes.length] %
(i + 1);

[
passwordChars[i],
passwordChars[j]
] = [
passwordChars[j],
passwordChars[i]
];
}

return passwordChars.join("");
}

const temporaryPassword =
generateSecurePassword();

document.getElementById(

);

}

/* =========================================================
SAVE DOCUMENT REVIEW
========================================================= */

async function saveAuditorDocumentReview(
event,
documentId
) {

event.preventDefault();

const form =
new FormData(
event.target
);

const status =
String(
form.get("status") ||
""
).trim();

const auditorNotes =
String(
form.get("auditor_notes") ||
""
).trim();

if (!status) {

showToast(
"الحالة مطلوبة",
"اختاري حالة المستند."
);

return;
}

try {

const {
data,
error
} =
await supabaseClient
.from("documents")
.update({

status:
status,

auditor_notes:
auditorNotes ||
null,

updated_at:
new Date().toISOString()
})
.eq(
"id",
documentId
)
.select()
.single();

if (error) {

console.error(
"DOCUMENT UPDATE ERROR:",
error
);

showToast(
"فشل تحديث المستند",
error.message
);

return;
}

const index =
dbDocuments.findIndex(
item =>
String(item.id) ===
String(documentId)
);

if (index >= 0) {

dbDocuments[index] =
data;
}

const client =
getClientById(
data.client_id
);

addLocalNotification(
"تم تحديث مستند",
`تمت مراجعة مستند ${client?.name || "العميل"} وتحديث حالته.`
);

if (
data.request_id &&
[
"accepted",
"revision"
].includes(
status
)
) {

const requestStatus =
status === "accepted"
? "accepted"
: "revision";

const {
error:
requestUpdateError
} =
await supabaseClient
.from(
"document_requests"
)
.update({

status:
requestStatus

})
.eq(
"id",
data.request_id
)
.eq(
"client_id",
data.client_id
);

if (requestUpdateError) {

console.error(
"REQUEST UPDATE ERROR:",
requestUpdateError
);

showToast(
"تم تحديث المستند",
"لكن تعذر تحديث حالة طلب المستند."
);
}

await loadRequestsFromSupabase();
}

closeModal();

toast(
"تم حفظ المراجعة",
"تم تحديث حالة المستند وملاحظات المدقق."
);

updateCounters();

renderDocuments();

} catch (error) {

console.error(
"SAVE REVIEW ERROR:",
error
);

showToast(
"خطأ",
error?.message ||
"تعذر حفظ المراجعة."
);
}
}


/* =========================================================
OPEN / DOWNLOAD FILE
========================================================= */

async function downloadAuditorDocument(
id
) {

const doc =
dbDocuments.find(
item =>
String(item.id) ===
String(id)
);

if (!doc) {

showToast(
"لا يوجد مستند",
"تعذر العثور على المستند."
);

return;
}

if (!doc.file_path) {

showToast(
"مسار الملف مفقود",
"السجل موجود لكن file_path فارغ."
);

return;
}

try {

showToast(
"جارٍ فتح الملف",
"يتم إنشاء رابط آمن للمستند..."
);

const {
data,
error
} =
await supabaseClient
.storage
.from(
"client-documents"
)
.createSignedUrl(
doc.file_path,
300
);

if (error) {

console.error(
"SIGNED URL ERROR:",
error
);

showToast(
"تعذر فتح الملف",
error.message
);

return;
}

if (!data?.signedUrl) {

showToast(
"تعذر فتح الملف",
"لم يتم إنشاء الرابط الآمن."
);

return;
}

const newWindow =
window.open(
data.signedUrl,
"_blank",
"noopener,noreferrer"
);

if (!newWindow) {

window.location.href =
data.signedUrl;
}

} catch (error) {

console.error(
"FILE OPEN ERROR:",
error
);

showToast(
"خطأ",
error?.message ||
"تعذر فتح الملف."
);
}
}

function runPreAudit() {

const results = [];

/*
نعتمد على المستندات والطلبات الموجودة فعليًا
ونولّد مؤشرات أولية مفيدة للمدقق.
*/

dbDocuments.forEach(function(doc) {

const request =
dbRequests.find(
item =>
String(item.id) ===
String(doc.request_id)
);

if (!doc.file_path) {

results.push({
level: "High",
title: doc.name || "مستند",
message: "المستند مسجل في قاعدة البيانات لكن مسار الملف مفقود."
});

return;
}

if (
doc.status === "revision"
) {

results.push({
level: "Medium",
title: doc.name || "مستند",
message: "المستند يحتاج تعديلًا أو إعادة رفع."
});

return;
}

if (
request &&
request.priority === "high" &&
doc.status === "uploaded"
) {

results.push({
level: "Medium",
title: doc.name || "مستند",
message: "طلب عالي الأولوية ما زال بانتظار المراجعة."
});

return;
}

results.push({
level: "Low",
title: doc.name || "مستند",
message: "المستند صالح مبدئيًا ولا توجد إشارة آلية إضافية."
});
});

let high = 0;
let medium = 0;
let low = 0;

results.forEach(function(item) {

if (item.level === "High") high++;
else if (item.level === "Medium") medium++;
else low++;
});

/*
تنظيف نتائج الفحص السابقة من السجل المحلي
*/
localState.auditTrail =
localState.auditTrail.filter(
item =>
!String(item.action || "")
.startsWith("فحص آلي -")
);

results.forEach(function(item) {

localState.auditTrail.unshift({
id:
"SCAN-" +
Date.now() +
"-" +
Math.random()
.toString(36)
.slice(2, 7),

action:
`فحص آلي - ${
item.level === "High"
? "عالية"
: item.level === "Medium"
? "متوسطة"
: "منخفضة"
}`,

entity:
"PreAudit",

entityId:
item.title,

details:
item.message,

timestamp:
new Date().toISOString()
});
});

saveLocalState();

const container =
document.getElementById("preAuditResults");

if (!container) return;

if (results.length === 0) {

container.innerHTML =
emptyState(
"لا توجد بيانات للفحص",
"لا توجد مستندات حالية يمكن تحليلها."
);

lucide.createIcons();
return;
}

return `

}
</td>

</td>

}).join("")}

function escapeHTML(
value
) {

if (
value === null ||
value === undefined
) {

return "";
}

return String(
value
)
.replaceAll(
"&",
"&amp;"
)
.replaceAll(
"<",
"&lt;"
)
.replaceAll(
">",
"&gt;"
)
.replaceAll(
'"',

)

"'",
"&#039;"
);
}

function formatSupabaseDate(
value
) {

if (!value) {
return "—";
}

try {

return new Intl.DateTimeFormat(
"ar-JO",
{
year:
"numeric",

month:
"2-digit",

day:
"2-digit",

hour:
"2-digit",

minute:
"2-digit"
}
).format(
new Date(
value
)
);

} catch (error) {

return String(
value
);
}
}


function formatDateTime(
date = new Date()
) {

return new Intl.DateTimeFormat(
"ar-JO",
{
year:
"numeric",

month:
"2-digit",

day:
"2-digit",

hour:
"2-digit",

minute:
"2-digit"
}
).format(
date
);
}


function formatFileSize(
bytes
) {

const value =
Number(
bytes || 0
);

if (
value ===
0
) {

return "0 KB";
}

const kb =
value / 1024;

if (
kb <
1024
) {

return `${kb.toFixed(1)} KB`;
}

return `${(
kb / 1024
).toFixed(2)} MB`;
}

const req = dbRequests.find(r => String(r.id) === String(doc.request_id));
if (req) req.status = "required";
}
renderDocuments();
updateCounters();
toast("تم حذف المستند", "تم حذف الملف وسجل المستند وإعادة طلبه إلى حالة مطلوب.");
} catch(error){
console.error("FINAL DELETE DOCUMENT ERROR", error);
showToast("فشل حذف المستند", humanError(error));
} finally {
setSystemStatus(true, currentRole === "admin" ? "متصل • مدير • تحديث مباشر" : "متصل • مدقق • تحديث مباشر");
}
};

async function loadMessagesForClient(clientId){
const { data, error } = await supabaseClient
.from("client_messages")
.select("id,client_id,sender,sender_user_id,message,read,created_at")
.eq("client_id", clientId)
.order("created_at", { ascending: true });
if (error) throw error;
return (data || []).map(row => ({
id: row.id,
client_id: row.client_id,
sender: row.sender,
sender_user_id: row.sender_user_id,
message: row.message,
read: Boolean(row.read),
timestamp: row.created_at
}));
}

sendAuditorMessage = async function(event, clientId){
event.preventDefault();
const form = new FormData(event.target);
const message = String(form.get("message") || "").trim();
if (!message) return;
try{
const result = await invokeService({
action: "send_message",
clientId: String(clientId),
message
});
await openClientChat(clientId);
event.target.reset();
toast("تم الإرسال", result.message || "تم إرسال الرسالة إلى العميل.");
} catch(error){
console.error("FINAL SEND MESSAGE ERROR", error);
showToast("فشل إرسال الرسالة", humanError(error));
}
};

openClientChat = async function(clientId){
const client = getClientById(clientId);
if (!client) return;
try{
localState.inquiryMessages = await loadMessagesForClient(clientId);
const incoming = localState.inquiryMessages.filter(m => m.sender === "client" && !m.read);

</div>

</div>
<form id="clientChatReplyForm" style="margin-top:16px;" onsubmit="sendAuditorMessage(event,'${escapeAttribute(clientId)}')">

);

renderClientMessages = async function(){
const content = document.getElementById("content");
if (!content) return;
const clients = dbClients || [];
let counts = new Map();
try {
const { data, error } = await supabaseClient
.from("client_messages")
.select("id,client_id,sender,read,message,created_at")
.order("created_at", { ascending: false });
if (error) throw error;
(data || []).forEach(row => {
const key = String(row.client_id);
if (!counts.has(key)) counts.set(key, { total: 0, unread: 0, last: null });
const c = counts.get(key);
c.total += 1;
if (row.sender === "client" && !row.read) c.unread += 1;
if (!c.last) c.last = row;
});
} catch(error){
console.error("FINAL MESSAGE LIST ERROR", error);
}
content.innerHTML = `
<div class="page-header">
<div><h2>رسائل العملاء</h2><p>التواصل المباشر مع العملاء وقراءة استفساراتهم والرد عليها.</p></div>

<div class="glass panel">
${clients.length === 0 ? emptyState("لا يوجد عملاء", "أنشئي ملف عميل أولًا لبدء المحادثات.") : `

${clients.map(client => {
const c = counts.get(String(client.id)) || { total: 0, unread: 0, last: null };
return `<tr>
<td><strong>${escapeHTML(client.name || client.company_name || "العميل")}</strong></td>
<td>${escapeHTML(client.email || "—")}</td>
<td>${c.unread ? `<span class="badge red">${c.unread} جديدة</span>` : `<span class="badge blue">${c.total}</span>`}</td>
<td>${escapeHTML(c.last?.message || "لا توجد رسائل")}</td>
<td><button class="btn secondary" type="button" onclick="openClientChat('${escapeAttribute(client.id)}')"><i data-lucide="message-circle"></i> فتح المحادثة</button></td>
</tr>`;
}).join("")}
</tbody></table></div>`}
</div>`;
updateClientMessagesCount();
lucide.createIcons();
};

async function startFinalRealtime(){
if (!currentUser?.id) return;
if (liveChannel){
try { await supabaseClient.removeChannel(liveChannel); } catch (_) {}
}
liveChannel = supabaseClient
.channel(`final-auditor-live-${currentUser.id}-${Date.now()}`)
.on("postgres_changes", { event: "*", schema: "public", table: "clients" }, async () => {
await loadClientsFromSupabase();
refreshCurrentPage();
})
.on("postgres_changes", { event: "*", schema: "public", table: "document_requests" }, async () => {
await loadRequestsFromSupabase();
refreshCurrentPage();
})
.on("postgres_changes", { event: "*", schema: "public", table: "documents" }, async payload => {
await Promise.all([loadDocumentsFromSupabase(), loadRequestsFromSupabase()]);
refreshCurrentPage();
if (payload.eventType === "INSERT") {
const client = getClientById(payload.new?.client_id);
const fileName = payload.new?.name || "مستند";
addLocalNotification("مستند جديد", `قام ${client?.name || "أحد العملاء"} برفع المستند "${fileName}".`);
}
})
.on("postgres_changes", { event: "*", schema: "public", table: "client_messages" }, async payload => {
await updateClientMessagesCount();
await renderQuickMessagesPanel();
if (currentPage === "clientmessages") await renderClientMessages();
const active = document.querySelector("[data-active-client-id]")?.dataset?.activeClientId;
if (currentPage === "clientmessages" && active) await openClientChat(active);
if (payload.eventType === "INSERT" && payload.new?.sender === "client") {
const client = getClientById(payload.new?.client_id);
addLocalNotification("رسالة جديدة", `وصلت رسالة جديدة من ${client?.name || "العميل"}.`);
}
})
.on("postgres_changes", { event: "*", schema: "public", table: "notifications", filter: `user_id=eq.${currentUser.id}` }, async () => {
try { await loadAuditorNotifications(); } catch (error) { console.error(error); }
})
.subscribe(status => {
if (status === "SUBSCRIBED") setSystemStatus(true, currentRole === "admin" ? "متصل • مدير • تحديث مباشر" : "متصل • مدقق • تحديث مباشر");
});
}

async function renderQuickMessagesPanel(){

const { data, error } = await supabaseClient
.from("client_messages")
.select("id,client_id,sender,message,read,created_at")
.order("created_at", { ascending: false })
.limit(100);
if (error) throw error;

const byClient = new Map();
(data || []).forEach(row => {
const key = String(row.client_id);
if (!byClient.has(key)) byClient.set(key, { last: row, unread: 0 });
const item = byClient.get(key);
if (row.sender === "client" && !row.read) item.unread += 1;
});

if (!byClient.size){
panelList.innerHTML = emptyState("لا توجد مسجات", "ستظهر محادثات العملاء هنا.");
return;
}

panelList.innerHTML = Array.from(byClient.entries()).map(([clientId, item]) => {

const name = client?.name || client?.company_name || "العميل";
const unread = item.unread;
return `
<div class="message-client-item" data-quick-client="${escapeAttribute(clientId)}">
<div class="message-client-row">
<div class="message-client-name">${escapeHTML(name)}</div>
${unread ? `<span class="badge red">${unread} جديدة</span>` : ""}
</div>
<div class="message-client-preview">${escapeHTML(item.last?.message || "لا توجد رسائل")}</div>
<div style="margin-top:5px;color:#69839e;font-size:8px;">${formatSupabaseDate(item.last?.created_at)}</div>
</div>`;
}).join("");

panelList.querySelectorAll("[data-quick-client]").forEach(el => {
el.addEventListener("click", async () => {
const clientId = el.dataset.quickClient;
const panel = document.getElementById("messagePanel");
if (panel) panel.classList.remove("show");
await openClientChat(clientId);
});
});
} catch(error){
console.error("QUICK MESSAGE PANEL ERROR", error);
panelList.innerHTML = emptyState("تعذر تحميل المسجات", humanError(error));
}
}

<script>
/* =========================================================
   AUDIT WORKSPACE V3
   - Activates tests, exceptions, reports, archive and audit trail.
   - Keeps the existing client/auditor/messages/notifications wiring intact.
   - Uses the existing local workspace for these new workflow modules.
   - Report delivery: stores the report record and sends a client message through
     the already-existing super-service messaging path. File upload can be wired
     later to Storage without changing the workflow UI.
   ========================================================= */
(function installAuditWorkspaceV3(){
  const safeArray = (key) => Array.isArray(localState?.[key]) ? localState[key] : [];

  function ensureState(){
    localState.tests = safeArray('tests');
    localState.exceptions = safeArray('exceptions');
    localState.reports = safeArray('reports');
    localState.archive = safeArray('archive');
    localState.auditTrail = safeArray('auditTrail');
    saveLocalState();
  }

  function notify(title, message){
    try { addLocalNotification(title, message); } catch (_) {}
  }

  function audit(action, entity, entityId, details, clientId = null){
    ensureStateNoSave();
    localState.auditTrail.unshift({
      id: `AT-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,
      action,
      entity,
      entityId: String(entityId || ''),
      clientId: clientId ? String(clientId) : null,
      details: String(details || ''),
      timestamp: new Date().toISOString(),
      userId: currentUser?.id || null
    });
    localState.auditTrail = localState.auditTrail.slice(0, 500);
    saveLocalState();
  }

  function ensureStateNoSave(){
    for (const k of ['tests','exceptions','reports','archive','auditTrail']) {
      if (!Array.isArray(localState[k])) localState[k] = [];
    }
  }

  function clientName(id){
    const c = getClientById(id);
    return c?.name || c?.company_name || 'العميل';
  }

  function severityBadge(value){
    const map = {
      high: '<span class="badge red">عالية</span>',
      medium: '<span class="badge orange">متوسطة</span>',
      low: '<span class="badge blue">منخفضة</span>'
    };
    return map[value] || '<span class="badge gray">غير محدد</span>';
  }

  function statusBadge(value){
    const map = {
      open: '<span class="badge red">مفتوحة</span>',
      in_progress: '<span class="badge orange">قيد المعالجة</span>',
      resolved: '<span class="badge green">مغلقة</span>',
      pass: '<span class="badge green">ناجح</span>',
      fail: '<span class="badge red">فاشل</span>',
      review: '<span class="badge orange">تحتاج مراجعة</span>',
      draft: '<span class="badge gray">مسودة</span>',
      issued: '<span class="badge green">صادر</span>'
    };
    return map[value] || `<span class="badge gray">${escapeHTML(String(value || 'غير محدد'))}</span>`;
  }

  function clientOptions(selected){
    return `<option value="">اختر العميل</option>` + dbClients.map(c => `
      <option value="${escapeAttribute(c.id)}" ${String(selected||'')===String(c.id)?'selected':''}>
        ${escapeHTML(c.name || c.company_name || 'العميل')}
      </option>`).join('');
  }

  /* =========================
     TESTS
     ========================= */
  renderTests = function(){
    ensureState();
    const content = document.getElementById('content');
    if (!content) return;
    const rows = localState.tests;
    content.innerHTML = `
      <div class="page-header">
        <div><h2>اختبارات التدقيق</h2><p>وثّقي الإجراء المنفذ ونتيجته وملاحظات المدقق لكل عميل.</p></div>
        <div class="page-actions">
          <button class="btn" type="button" onclick="openTestModal()"><i data-lucide="plus"></i> اختبار جديد</button>
          <button class="btn secondary" type="button" onclick="renderTests()"><i data-lucide="refresh-cw"></i> تحديث</button>
        </div>
      </div>
      <div class="glass panel">
        ${rows.length === 0 ? emptyState('لا توجد اختبارات بعد','أنشئي أول اختبار تدقيق لبدء توثيق الإجراءات والنتائج.') : `
        <div class="table-wrapper"><table><thead><tr>
          <th>العميل</th><th>الاختبار</th><th>الإجراء</th><th>النتيجة</th><th>التاريخ</th><th>الإجراءات</th>
        </tr></thead><tbody>
          ${rows.map(t => `<tr>
            <td>${escapeHTML(clientName(t.clientId))}</td>
            <td><strong>${escapeHTML(t.title)}</strong><div class="document-preview-meta">${escapeHTML(t.area||'')}</div></td>
            <td>${escapeHTML(t.procedure || '—')}</td>
            <td>${statusBadge(t.result)}</td>
            <td>${escapeHTML(formatDateTime(new Date(t.createdAt)))}</td>
            <td><button class="btn secondary" type="button" onclick="viewTest('${escapeAttribute(t.id)}')">عرض</button>
                <button class="btn danger" type="button" onclick="deleteTest('${escapeAttribute(t.id)}')"><i data-lucide="trash-2"></i> حذف</button></td>
          </tr>`).join('')}
        </tbody></table></div>`}
      </div>`;
    lucide.createIcons();
  };

  window.openTestModal = function(existingId=null){
    ensureState();
    const existing = localState.tests.find(x=>String(x.id)===String(existingId));
    openModal(existing ? 'تعديل اختبار تدقيق' : 'إضافة اختبار تدقيق', `
      <form id="testForm" onsubmit="saveTest(event,'${escapeAttribute(existing?.id || '')}')">
        <div class="form-grid">
          <div class="form-group full"><label>العميل *</label><select name="clientId" required>${clientOptions(existing?.clientId)}</select></div>

  window.saveReport=async function(event,existingId){
    event.preventDefault(); ensureStateNoSave(); const f=new FormData(event.target); const clientId=String(f.get('clientId')||'').trim(); const title=String(f.get('title')||'').trim(); const summary=String(f.get('summary')||'').trim(); if(!clientId||!title||!summary)return showToast('بيانات ناقصة','اختاري العميل وأكملي عنوان وملخص التقرير.');
    const old=localState.reports.find(x=>String(x.id)===String(existingId)); const item={id:existingId||`RPT-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,clientId,title,type:String(f.get('type')||'نهائي'),status:String(f.get('status')||'draft'),summary,deliveryNote:String(f.get('deliveryNote')||'').trim(),createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString(),deliveredAt:old?.deliveredAt||null,filePath:old?.filePath||null,fileUrl:old?.fileUrl||null};
    const file=f.get('reportFile');
    if(file && file instanceof File && file.size>0){
      try{ item.filePath=await uploadAuditReportFile(file,clientId,item.id); item.fileUrl=await createAuditReportSignedUrl(item.filePath); }
      catch(error){ console.error('REPORT FILE UPLOAD ERROR',error); return showToast('تعذر رفع ملف التقرير',error?.message||'تأكد من إنشاء Bucket باسم audit-reports وصلاحيات Storage.'); }
    }
    const idx=localState.reports.findIndex(x=>String(x.id)===String(item.id)); if(idx>=0)localState.reports[idx]=item;else localState.reports.unshift(item); saveLocalState(); audit(idx>=0?'تعديل تقرير':'إصدار تقرير','report',item.id,item.title,clientId); closeModal(); renderReports(); toast('تم حفظ التقرير','تم حفظ التقرير ويمكن تسليمه للعميل.');
    if(item.status==='issued') await deliverReportToClient(item);
  };

  function safeReportName(name){
    return String(name||'report').replace(/[^a-zA-Z0-9._-]+/g,'-').replace(/-+/g,'-').slice(0,80) || 'report';
  }

  async function uploadAuditReportFile(file,clientId,reportId){
    const bucket='audit-reports';
    const path=`${String(clientId)}/${reportId}-${Date.now()}-${safeReportName(file.name)}`;
    const { error } = await supabaseClient.storage.from(bucket).upload(path,file,{upsert:false,contentType:file.type||'application/octet-stream'});
    if(error) throw error;
    return path;
  }

  async function createAuditReportSignedUrl(path){
    if(!path) return null;
    const { data, error } = await supabaseClient.storage.from('audit-reports').createSignedUrl(path,60*60*24*30);
    if(error) throw error;
    return data?.signedUrl || null;
  }

  async function deliverReportToClient(report){
    try{
      let fileUrl=report.fileUrl||null;
      if(report.filePath && !fileUrl){ try{ fileUrl=await createAuditReportSignedUrl(report.filePath); }catch(_){} }
      const message = `تم إصدار تقرير: ${report.title}\n\n${report.summary}\n\n${report.deliveryNote||'التقرير صادر من بوابة التدقيق الإلكترونية.'}${fileUrl?`\n\nرابط فتح التقرير (صالح لمدة 30 يومًا):\n${fileUrl}`:''}`;
      if(typeof invokeService==='function'){
        await invokeService({action:'send_message',clientId:String(report.clientId),message});
      } else if(typeof sendAuditorMessage==='function'){
        throw new Error('خدمة التسليم الحالية غير متاحة.');
      }
      const idx=localState.reports.findIndex(x=>String(x.id)===String(report.id));
      if(idx>=0){localState.reports[idx].deliveredAt=new Date().toISOString(); saveLocalState();}
      audit('تسليم تقرير للعميل','report',report.id,`تم إرسال ${report.title} عبر المسجات`,report.clientId);
      notify('تم تسليم التقرير',`تم إرسال ${report.title} إلى ${clientName(report.clientId)} عبر المسجات.`);
      toast('تم التسليم','تم إرسال ملخص التقرير للعميل عبر قناة المسجات الحالية.');
      renderReports();
    }catch(error){
      console.error('REPORT DELIVERY ERROR',error);
      showToast('تعذر التسليم',`تم حفظ التقرير لكن تعذر إرسال رسالة التسليم: ${error?.message||'خطأ غير معروف'}`);
    }
  }

    content.innerHTML=`<div class="page-header"><div><h2>الأرشيف</h2><p>احتفظي بنسخ العمل المغلقة مع سبب الأرشفة وتاريخها، ويمكن استعادتها عند الحاجة.</p></div><div class="page-actions"><button class="btn" onclick="openArchiveModal()"><i data-lucide="archive"></i> أرشفة عنصر</button><button class="btn secondary" onclick="renderArchive()"><i data-lucide="refresh-cw"></i> تحديث</button></div></div>
    <div class="glass panel">${rows.length===0?emptyState('الأرشيف فارغ','استخدمي أرشفة عنصر بعد إغلاق المهمة أو التقرير أو الاستثناء.'): `<div class="table-wrapper"><table><thead><tr><th>النوع</th><th>العنوان</th><th>العميل</th><th>سبب الأرشفة</th><th>التاريخ</th><th>الإجراء</th></tr></thead><tbody>${rows.map(a=>`<tr><td><span class="badge blue">${escapeHTML(a.type)}</span></td><td><strong>${escapeHTML(a.title)}</strong></td><td>${escapeHTML(clientName(a.clientId))}</td><td>${escapeHTML(a.reason||'—')}</td><td>${escapeHTML(formatDateTime(new Date(a.archivedAt)))}</td><td><button class="btn secondary" onclick="restoreArchive('${escapeAttribute(a.id)}')">استعادة</button><button class="btn danger" onclick="deleteArchive('${escapeAttribute(a.id)}')"><i data-lucide="trash-2"></i> حذف</button></td></tr>`).join('')}</tbody></table></div>`}</div>`;
    lucide.createIcons();
  };

  window.openArchiveModal=function(){
    openModal('أرشفة عنصر',`<form onsubmit="saveArchive(event)"><div class="form-grid">
      <div class="form-group"><label>نوع العنصر *</label><select name="type" required><option value="exception">استثناء</option><option value="test">اختبار</option><option value="report">تقرير</option></select></div>
      <div class="form-group"><label>العنصر *</label><select name="itemId" id="archiveItemId" required></select></div>
      <div class="form-group full"><label>سبب الأرشفة</label><textarea name="reason" placeholder="مثال: تم إغلاق الملاحظة وإتمام المعالجة."></textarea></div>
    </div><div class="modal-actions"><button class="btn" type="submit">أرشفة</button><button class="btn secondary" type="button" onclick="closeModal()">إلغاء</button></div></form>`);
    const typeEl=document.querySelector('#modalBody select[name="type"]'); const itemEl=document.getElementById('archiveItemId');
    function refill(){const type=typeEl.value;const key=type==='exception'?'exceptions':type==='test'?'tests':'reports';const arr=localState[key]||[];itemEl.innerHTML=`<option value="">اختر</option>`+arr.map(x=>`<option value="${escapeAttribute(x.id)}">${escapeHTML(x.title)}</option>`).join('');}
    typeEl.addEventListener('change',refill);refill();lucide.createIcons();
  };

  window.saveArchive=function(event){
    event.preventDefault();ensureStateNoSave();const f=new FormData(event.target);const type=String(f.get('type')||'');const itemId=String(f.get('itemId')||'');if(!type||!itemId)return showToast('بيانات ناقصة','اختاري العنصر المراد أرشفته.');
    const key=type==='exception'?'exceptions':type==='test'?'tests':'reports';const item=(localState[key]||[]).find(x=>String(x.id)===String(itemId));if(!item)return showToast('العنصر غير موجود','تعذر العثور على العنصر.');
    localState.archive.unshift({id:`ARC-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,sourceId:item.id,type,title:item.title,clientId:item.clientId||item.client_id,reason:String(f.get('reason')||'').trim(),archivedAt:new Date().toISOString(),snapshot:item});
    localState[key]=(localState[key]||[]).filter(x=>String(x.id)!==String(itemId));saveLocalState();audit('أرشفة عنصر',type,itemId,item.title,item.clientId||item.client_id);closeModal();renderArchive();toast('تمت الأرشفة','تم نقل العنصر إلى الأرشيف.');
  };

  window.restoreArchive=function(id){const a=localState.archive.find(x=>String(x.id)===String(id));if(!a)return;const key=a.type==='exception'?'exceptions':a.type==='test'?'tests':'reports';localState[key].unshift(a.snapshot);localState.archive=localState.archive.filter(x=>String(x.id)!==String(id));saveLocalState();audit('استعادة من الأرشيف',a.type,a.sourceId,a.title,a.clientId);renderArchive();toast('تمت الاستعادة','تمت إعادة العنصر إلى مساحة العمل.');};
  window.deleteArchive=function(id){const a=localState.archive.find(x=>String(x.id)===String(id));if(!a)return;if(!confirm(`حذف الأرشيف "${a.title}" نهائيًا من مساحة العمل؟`))return;localState.archive=localState.archive.filter(x=>String(x.id)!==String(id));saveLocalState();audit('حذف من الأرشيف',a.type,a.sourceId,a.title,a.clientId);renderArchive();toast('تم الحذف','تم حذف النسخة المؤرشفة.');};

  /* =========================
     AUDIT TRAIL
     ========================= */
  renderAuditTrail=function(){
    ensureState(); const content=document.getElementById('content');if(!content)return;const rows=localState.auditTrail;
    content.innerHTML=`<div class="page-header"><div><h2>سجل التدقيق</h2><p>خط زمني للعمليات التي تمت داخل مساحة عمل المدقق.</p></div><div class="page-actions"><button class="btn secondary" onclick="renderAuditTrail()"><i data-lucide="refresh-cw"></i> تحديث</button><button class="btn danger" onclick="clearAuditTrail()">مسح السجل المحلي</button></div></div>
    <div class="glass panel">${rows.length===0?emptyState('لا توجد عمليات','ستظهر هنا عمليات إنشاء وتعديل وحذف وأرشفة وفحص آلي.'): `<div class="timeline">${rows.map(r=>`<div class="timeline-item"><div class="timeline-dot"></div><div class="timeline-content"><strong>${escapeHTML(r.action||'عملية')}</strong><p>${escapeHTML(r.details||'')}</p><div class="timeline-time">${escapeHTML(formatDateTime(new Date(r.timestamp)))} ${r.clientId?`• ${escapeHTML(clientName(r.clientId))}`:''}</div></div></div>`).join('')}</div>`}</div>`;
    lucide.createIcons();
  };
  window.clearAuditTrail=function(){if(!confirm('مسح سجل التدقيق المحلي؟'))return;localState.auditTrail=[];saveLocalState();renderAuditTrail();toast('تم المسح','تم مسح السجل المحلي.');};

  /* =========================
     IMPROVED AUTO AUDIT
     ========================= */
  function buildPreAuditResults(){
    const results=[]; const now=Date.now();
    const requestById=new Map(dbRequests.map(r=>[String(r.id),r]));
    const docsByName=new Map();
    dbDocuments.forEach(d=>{const key=`${d.client_id}::${String(d.name||'').trim().toLowerCase()}`;if(!docsByName.has(key))docsByName.set(key,[]);docsByName.get(key).push(d);});

    dbRequests.forEach(r=>{
      const ageDays=r.created_at?Math.floor((now-new Date(r.created_at).getTime())/86400000):0;
      if(['required','pending'].includes(String(r.status||'')) && ageDays>=7){
        results.push({level:'Medium',category:'متابعة',title:r.title||'طلب مستند',message:`طلب مفتوح منذ ${ageDays} يومًا دون استكمال واضح.`,recommendation:'راجع حالة الطلب وتواصل مع العميل إذا كان المستند ما زال مطلوبًا.',clientId:r.client_id});
      }
    });

    dbDocuments.forEach(doc=>{
      const request=requestById.get(String(doc.request_id));
      if(!doc.file_path){results.push({level:'High',category:'سلامة بيانات',title:doc.name||'مستند',message:'سجل المستند موجود لكن مسار الملف مفقود.',recommendation:'تحقق من الملف والتخزين قبل الاعتماد عليه.',clientId:doc.client_id});return;}
      if(doc.status==='revision'){results.push({level:'Medium',category:'مراجعة',title:doc.name||'مستند',message:'المستند في حالة يحتاج تعديل.',recommendation:'راجع ملاحظات المدقق واطلب نسخة مصححة.',clientId:doc.client_id});}
      if(request?.priority==='high' && doc.status==='uploaded'){results.push({level:'Medium',category:'أولوية',title:doc.name||'مستند',message:'المستند مرتبط بطلب عالي الأولوية وما زال بانتظار المراجعة.',recommendation:'ضع المستند ضمن أولويات المراجعة الحالية.',clientId:doc.client_id});}
      if(!request && doc.request_id){results.push({level:'Medium',category:'اتساق',title:doc.name||'مستند',message:'مرجع طلب المستند غير موجود في البيانات الحالية.',recommendation:'تحقق من ربط المستند بالطلب الصحيح.',clientId:doc.client_id});}
      const key=`${doc.client_id}::${String(doc.name||'').trim().toLowerCase()}`;if((docsByName.get(key)||[]).length>1){results.push({level:'Analytical',category:'مؤشر تحليلي',title:doc.name||'مستند',message:'يوجد أكثر من سجل باسم ملف مشابه لنفس العميل.',recommendation:'تحقق من التكرار ومن النسخة الصحيحة المستخدمة في المراجعة.',clientId:doc.client_id});}
    });

    localState.exceptions.filter(e=>e.status!=='resolved').forEach(e=>{
      if(e.severity==='high')results.push({level:'High',category:'استثناء',title:e.title,message:'يوجد استثناء عالي الخطورة ما زال مفتوحًا.',recommendation:'راجع الاستثناء مع أولوية مرتفعة ووثّق المعالجة.',clientId:e.clientId});
      else if(e.severity==='medium')results.push({level:'Medium',category:'استثناء',title:e.title,message:'يوجد استثناء متوسط الخطورة يحتاج متابعة.',recommendation:'تابع الإجراء التصحيحي وحدد موعدًا للإغلاق.',clientId:e.clientId});
    });
    if(!results.length){results.push({level:'Analytical',category:'مؤشر تحليلي',title:'لا توجد إشارات آلية واضحة',message:'لم يظهر في البيانات الحالية مؤشر يحتاج تصعيدًا آليًا.',recommendation:'هذا لا يغني عن إجراءات التدقيق والحكم المهني.',clientId:null});}
    return results;
  }

  renderPreAudit=function(){
    ensureState(); const content=document.getElementById('content');if(!content)return;
    const results=buildPreAuditResults();const high=results.filter(x=>x.level==='High').length;const medium=results.filter(x=>x.level==='Medium').length;const analytical=results.filter(x=>x.level==='Analytical').length;
    content.innerHTML=`<div class="page-header"><div><h2>الفحص الآلي الأولي</h2><p>تحليل قواعدي أولي للبيانات المتاحة. النتائج مؤشرات مساعدة وليست حكم تدقيق نهائي.</p></div><button class="btn" onclick="runPreAudit()"><i data-lucide="play"></i> تشغيل الفحص</button></div>
      <div class="risk-grid"><div class="risk-card glass high"><span class="stat-label">عالية الخطورة</span><div class="number">${high}</div></div><div class="risk-card glass medium"><span class="stat-label">تحتاج مراجعة</span><div class="number">${medium}</div></div><div class="risk-card glass low"><span class="stat-label">مؤشرات تحليلية</span><div class="number">${analytical}</div></div></div>
      <div class="glass panel" style="margin-top:18px"><div class="panel-header"><div><div class="panel-title">نتائج الفحص</div><div class="panel-sub">لكل نتيجة: السبب + التوصية العملية للمدقق.</div></div></div>
      <div class="table-wrapper"><table><thead><tr><th>التصنيف</th><th>العنصر</th><th>الخطورة</th><th>النتيجة</th><th>التوصية</th></tr></thead><tbody>${results.map(r=>`<tr><td>${escapeHTML(r.category||'—')}</td><td>${escapeHTML(r.title||'—')}<div class="document-preview-meta">${r.clientId?escapeHTML(clientName(r.clientId)):'عام'}</div></td><td>${r.level==='High'?'<span class="badge red">عالية</span>':r.level==='Medium'?'<span class="badge orange">تحتاج مراجعة</span>':'<span class="badge blue">تحليلي</span>'}</td><td>${escapeHTML(r.message||'')}</td><td>${escapeHTML(r.recommendation||'—')}</td></tr>`).join('')}</tbody></table></div></div>`;
    lucide.createIcons();
  };

  runPreAudit=function(){
    ensureState(); const results=buildPreAuditResults();
    localState.auditTrail=localState.auditTrail.filter(x=>!String(x.action||'').startsWith('فحص آلي'));
    results.forEach(r=>localState.auditTrail.unshift({id:`SCAN-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,action:`فحص آلي - ${r.level==='High'?'عالية':r.level==='Medium'?'تحتاج مراجعة':'تحليلي'}`,entity:'PreAudit',entityId:r.title,clientId:r.clientId||null,details:`${r.message} | ${r.recommendation}`,timestamp:new Date().toISOString(),userId:currentUser?.id||null}));
    saveLocalState(); audit('تشغيل الفحص الآلي','PreAudit',`SCAN-${Date.now()}`,`تم تحليل ${dbDocuments.length} مستند و${dbRequests.length} طلب مستند`); renderPreAudit(); toast('اكتمل الفحص',`تم تحليل ${dbDocuments.length} مستند و${dbRequests.length} طلب مستند.`);
  };

  /* Make navigation refresh the new pages correctly without touching messages. */
  const baseRefreshCurrentPage = typeof refreshCurrentPage==='function' ? refreshCurrentPage : null;
  refreshCurrentPage = function(){
    updateCounters();
    if(currentPage==='dashboard') renderDashboard();
    else if(currentPage==='clients') renderClients();
    else if(currentPage==='requests') renderRequestsPage();
    else if(currentPage==='documents') renderDocuments();
    else if(currentPage==='tests') renderTests();
    else if(currentPage==='exceptions') renderExceptions();
    else if(currentPage==='reports') renderReports();
    else if(currentPage==='archive') renderArchive();
    else if(currentPage==='audittrail') renderAuditTrail();
    else if(currentPage==='preaudit') renderPreAudit();
    else if(currentPage==='clientmessages') renderClientMessages();
    lucide.createIcons();
  };

  /* Keep the existing Supabase-backed document deletion untouched, but log the action when it succeeds. */
  const originalDeleteAuditorDocument = window.deleteAuditorDocument;
  if(typeof originalDeleteAuditorDocument==='function'){
    window.deleteAuditorDocument = async function(id){
      const doc=dbDocuments.find(d=>String(d.id)===String(id));
      await originalDeleteAuditorDocument(id);
      if(doc) audit('حذف مستند','document',id,`تم حذف ${doc.name||'مستند'}`,doc.client_id);
    };
  }

  ensureState();
  console.log('AUDIT WORKSPACE V3: installed');
})();
</script>


<script>
/* =========================================================
   AUDIT WORKSPACE V4 — SHARED REPORTS WITH CLIENT PORTAL
   - Keeps existing document_requests / documents / client_messages / notifications.
   - Persists audit reports in public.audit_reports.
   - Client reads the same report records and private Storage files.
   ========================================================= */
(function installAuditWorkspaceV4(){
  const REPORT_BUCKET = 'audit-reports';
  let auditReportsChannel = null;

  function ensureState(){
    if (!Array.isArray(localState.reports)) localState.reports = [];
    if (!Array.isArray(localState.auditTrail)) localState.auditTrail = [];
  }

  function clientName(id){
    const c = getClientById(id);
    return c?.name || c?.company_name || 'العميل';
  }

  function clientOptions(selected){
    return `<option value="">اختر العميل</option>` + dbClients.map(c => `
      <option value="${escapeAttribute(c.id)}" ${String(selected||'')===String(c.id)?'selected':''}>
        ${escapeHTML(c.name || c.company_name || 'العميل')}
      </option>`).join('');
  }

  function reportStatusBadge(value){
    const map = {
      draft: '<span class="badge gray">مسودة</span>',
      issued: '<span class="badge green">صادر</span>',
      delivered: '<span class="badge blue">تم التسليم</span>'
    };
    return map[value] || '<span class="badge gray">غير محدد</span>';
  }

  async function loadAuditorReports(){
    ensureState();
    if (!currentUser?.id) return;
    const { data, error } = await supabaseClient
      .from('audit_reports')
      .select('id,client_id,title,type,status,summary,delivery_note,file_path,created_by,created_at,updated_at,issued_at,delivered_at')
      .order('created_at', { ascending:false });
    if (error) throw error;
    localState.reports = data || [];
    saveLocalState();
  }

  async function createReportSignedUrl(path){
    if (!path) return null;
    const { data, error } = await supabaseClient.storage
      .from(REPORT_BUCKET)
      .createSignedUrl(path, 60 * 60 * 24 * 30);
    if (error) throw error;
    return data?.signedUrl || null;
  }

  async function uploadReportFile(file, clientId, reportId){
    const safe = String(file.name||'report').replace(/[^a-zA-Z0-9._-]+/g,'-').replace(/-+/g,'-').slice(0,80) || 'report';
    const path = `${String(clientId)}/${String(reportId)}-${Date.now()}-${safe}`;
    const { error } = await supabaseClient.storage.from(REPORT_BUCKET).upload(path, file, {
      upsert:false,
      contentType:file.type || 'application/octet-stream'
    });
    if (error) throw error;
    return path;
  }

  async function notifyClient(report, extraMessage){
    const client = getClientById(report.client_id || report.clientId);
    if (!client?.user_id) return;
    const payload = {
      user_id: client.user_id,
      client_id: client.id,
      audience: 'client',
      title: 'تقرير تدقيق جديد',
      message: extraMessage || `تم إصدار التقرير «${report.title}». يمكنك فتحه من بوابة العميل.`,
      read: false
    };
    const { error } = await supabaseClient.from('notifications').insert(payload);
    if (error) console.warn('REPORT CLIENT NOTIFICATION ERROR:', error.message);
  }

  function audit(action, entityId, details, clientId){
    ensureState();
    localState.auditTrail.unshift({
      id:`AT-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,
      action,
      entity:'report',
      entityId:String(entityId || ''),
      clientId:clientId ? String(clientId) : null,
      details:String(details || ''),
      timestamp:new Date().toISOString(),
      userId:currentUser?.id || null
    });
    localState.auditTrail = localState.auditTrail.slice(0,500);
    saveLocalState();
  }

  renderReports = async function(){
    ensureState();
    try { await loadAuditorReports(); } catch(error){ console.error('REPORT LOAD ERROR', error); }
    const content=document.getElementById('content'); if(!content) return;
    const rows=localState.reports || [];
    content.innerHTML=`
      <div class="page-header">
        <div><h2>تقارير التدقيق</h2><p>إصدار التقارير وتسليمها مباشرة إلى بوابة العميل.</p></div>
        <div class="page-actions">
          <button class="btn" onclick="openReportModalV4()"><i data-lucide="file-up"></i> تقرير جديد</button>
          <button class="btn secondary" onclick="renderReports()"><i data-lucide="refresh-cw"></i> تحديث</button>
        </div>
      </div>
      <div class="glass panel">
        ${rows.length===0 ? emptyState('لا توجد تقارير','أنشئي تقريرًا ليظهر للعميل عند تسليمه.') : `
        <div class="table-wrapper"><table><thead><tr>
          <th>العميل</th><th>التقرير</th><th>الحالة</th><th>تاريخ الإنشاء</th><th>التسليم</th><th>الإجراءات</th>
        </tr></thead><tbody>
        ${rows.map(r=>`<tr>
          <td>${escapeHTML(clientName(r.client_id))}</td>
          <td><strong>${escapeHTML(r.title)}</strong><div class="document-preview-meta">${escapeHTML(r.type||'')}</div></td>
          <td>${reportStatusBadge(r.delivered_at ? 'delivered' : r.status)}</td>
          <td>${escapeHTML(formatSupabaseDate(r.created_at))}</td>
          <td>${r.delivered_at ? `<span class="badge green">تم التسليم</span>` : `<span class="badge orange">لم يتم بعد</span>`}</td>
          <td><button class="btn secondary" onclick="viewReportV4('${escapeAttribute(r.id)}')">عرض</button></td>
        </tr>`).join('')}
        </tbody></table></div>`}
      </div>`;
    lucide.createIcons();
  };

  window.openReportModalV4 = function(existingId=null){
    ensureState();
    const existing=localState.reports.find(r=>String(r.id)===String(existingId));
    openModal(existing?'تعديل تقرير التدقيق':'إصدار تقرير تدقيق', `
      <form onsubmit="saveReportV4(event,'${escapeAttribute(existing?.id||'')}')">
        <div class="form-grid">
          <div class="form-group full"><label>العميل *</label><select name="client_id" required>${clientOptions(existing?.client_id)}</select></div>
          <div class="form-group full"><label>عنوان التقرير *</label><input name="title" required value="${escapeAttribute(existing?.title||'')}" placeholder="تقرير التدقيق للسنة المالية 2026"></div>
          <div class="form-group"><label>نوع التقرير</label><select name="type"><option value="نهائي" ${existing?.type==='نهائي'?'selected':''}>نهائي</option><option value="مرحلي" ${existing?.type==='مرحلي'?'selected':''}>مرحلي</option><option value="ملاحظات" ${existing?.type==='ملاحظات'?'selected':''}>ملاحظات</option></select></div>
          <div class="form-group"><label>الحالة</label><select name="status"><option value="draft" ${existing?.status==='draft'?'selected':''}>مسودة</option><option value="issued" ${existing?.status==='issued'?'selected':''}>صادر وتسليم</option></select></div>
          <div class="form-group full"><label>ملخص التقرير *</label><textarea name="summary" required>${escapeHTML(existing?.summary||'')}</textarea></div>
          <div class="form-group full"><label>ملف التقرير</label><input name="report_file" type="file" accept=".pdf,.doc,.docx,.xlsx,.xls,.png,.jpg,.jpeg"><div class="document-preview-meta" style="margin-top:5px">يُحفظ في Bucket: ${REPORT_BUCKET}</div></div>
          <div class="form-group full"><label>ملاحظة للعميل</label><textarea name="delivery_note">${escapeHTML(existing?.delivery_note||'')}</textarea></div>
        </div>
        <div class="modal-actions"><button class="btn" type="submit">حفظ التقرير</button><button class="btn secondary" type="button" onclick="closeModal()">إلغاء</button></div>
      </form>`);
    lucide.createIcons();
  };

  window.saveReportV4 = async function(event, existingId){
    event.preventDefault();
    const f=new FormData(event.target);
    const clientId=String(f.get('client_id')||'').trim();
    const title=String(f.get('title')||'').trim();
    const summary=String(f.get('summary')||'').trim();
    const status=String(f.get('status')||'draft');
    if(!clientId||!title||!summary) return showToast('بيانات ناقصة','اختاري العميل وأكملي التقرير.');
    try{
      setSystemStatus(true,'جارٍ حفظ التقرير...');
      let reportId=existingId || crypto.randomUUID();
      let filePath = localState.reports.find(r=>String(r.id)===String(existingId))?.file_path || null;
      const file=f.get('report_file');
      if(file instanceof File && file.size>0) filePath=await uploadReportFile(file,clientId,reportId);
      const payload={client_id:clientId,title,type:String(f.get('type')||'نهائي'),status,summary,delivery_note:String(f.get('delivery_note')||'').trim()||null,file_path:filePath,created_by:currentUser?.id||null,updated_at:new Date().toISOString(),issued_at:status==='issued'?new Date().toISOString():null};
      let data,error;
      if(existingId){
        ({data,error}=await supabaseClient.from('audit_reports').update(payload).eq('id',existingId).select().single());
      }else{
        ({data,error}=await supabaseClient.from('audit_reports').insert(payload).select().single());
      }
      if(error) throw error;
      const idx=localState.reports.findIndex(r=>String(r.id)===String(data.id));
      if(idx>=0) localState.reports[idx]=data; else localState.reports.unshift(data);
      saveLocalState();
      audit(existingId?'تعديل تقرير':'إنشاء تقرير',data.id,data.title,clientId);
      closeModal();
      await renderReports();
      if(status==='issued') await deliverReportV4(data);
      else toast('تم حفظ التقرير','تم حفظ التقرير كمسودة.');
    }catch(error){
      console.error('SAVE REPORT V4 ERROR',error);
      showToast('فشل حفظ التقرير',error?.message||'تعذر حفظ التقرير.');
    }finally{
      setSystemStatus(true,currentRole === 'admin' ? 'متصل • مدير • تحديث مباشر' : 'متصل • مدقق • تحديث مباشر');
    }
  };

  async function deliverReportV4(report){
    try{
      let fileUrl=null;
      if(report.file_path) fileUrl=await createReportSignedUrl(report.file_path);
      const message=`تم إصدار تقرير التدقيق: ${report.title}\n\n${report.summary}\n\n${report.delivery_note||'يمكنك متابعة التقرير من بوابة التدقيق الإلكترونية.'}${fileUrl?`\n\nرابط فتح التقرير (صالح لمدة 30 يومًا):\n${fileUrl}`:''}`;
      await invokeService({action:'send_message',clientId:String(report.client_id),message});
      const {data,error}=await supabaseClient.from('audit_reports').update({delivered_at:new Date().toISOString(),status:'issued'}).eq('id',report.id).select().single();
      if(error) throw error;
      const idx=localState.reports.findIndex(r=>String(r.id)===String(report.id));
      if(idx>=0) localState.reports[idx]=data;
      saveLocalState();
      await notifyClient(data,`تم إصدار التقرير «${data.title}» وإرساله لك. ستجد الملف أيضًا في قسم التقارير.`);
      audit('تسليم تقرير للعميل',data.id,`تم إرسال التقرير عبر المسجات إلى ${clientName(data.client_id)}`,data.client_id);
      toast('تم تسليم التقرير','تم إرسال التقرير إلى بوابة العميل عبر المسجات والتنبيه.');
      await renderReports();
    }catch(error){
      console.error('DELIVER REPORT V4 ERROR',error);
      showToast('تعذر التسليم',`تم حفظ التقرير، لكن تعذر تسليمه: ${error?.message||'خطأ غير معروف'}`);
    }
  }

  window.viewReportV4 = async function(id){
    const report=localState.reports.find(r=>String(r.id)===String(id)); if(!report)return;
    let url=null;
    if(report.file_path){ try{ url=await createReportSignedUrl(report.file_path); }catch(_){} }
    openModal('تفاصيل التقرير',`<div class="document-preview"><div class="document-preview-header"><div><div class="document-preview-name">${escapeHTML(report.title)}</div><div class="document-preview-meta">${escapeHTML(clientName(report.client_id))} • ${escapeHTML(report.type||'')}</div></div>${reportStatusBadge(report.delivered_at?'delivered':report.status)}</div><div class="info-box">${escapeHTML(report.summary)}</div>${url?`<div class="info-box" style="margin-top:10px"><a href="${escapeAttribute(url)}" target="_blank" rel="noopener" style="color:#72c7ff">فتح ملف التقرير</a></div>`:''}<div class="document-preview-meta" style="margin-top:10px">${report.delivered_at?'تم التسليم: '+escapeHTML(formatSupabaseDate(report.delivered_at)):'لم يتم التسليم بعد'}</div></div><div class="modal-actions">${report.status==='issued'&&!report.delivered_at?`<button class="btn" onclick="deliverReportV4ById('${escapeAttribute(report.id)}')">تسليم للعميل</button>`:''}<button class="btn secondary" onclick="openReportModalV4('${escapeAttribute(report.id)}')">تعديل</button><button class="btn secondary" onclick="closeModal()">إغلاق</button></div>`);
    lucide.createIcons();
  };
  window.deliverReportV4ById=async function(id){const report=localState.reports.find(r=>String(r.id)===String(id));if(!report)return;closeModal();await deliverReportV4(report);};

  async function startReportRealtime(){
    if(!currentUser?.id)return;
    if(auditReportsChannel){try{await supabaseClient.removeChannel(auditReportsChannel);}catch(_){} }
    auditReportsChannel=supabaseClient.channel(`auditor-reports-${currentUser.id}-${Date.now()}`)
      .on('postgres_changes',{event:'*',schema:'public',table:'audit_reports'},async()=>{
        try{await loadAuditorReports(); if(currentPage==='reports') await renderReports();}catch(error){console.error('REPORT REALTIME ERROR',error);}
      }).subscribe();
  }

  const baseComplete = completeAuditorLogin;
  completeAuditorLogin = async function(user){
    const ok=await baseComplete(user);
    if(!ok)return ok;
    try{ await loadAuditorReports(); await startReportRealtime(); }catch(error){ console.error('REPORT LOGIN SYNC ERROR',error); }
    return ok;
  };

  const baseStop = stopRealtime;
  stopRealtime = async function(){
    try{await baseStop();}catch(_){}
    if(auditReportsChannel){try{await supabaseClient.removeChannel(auditReportsChannel);}catch(_){} auditReportsChannel=null;}
  };

  const baseRefresh = refreshCurrentPage;
  refreshCurrentPage = function(){
    if(currentPage==='reports') void renderReports(); else baseRefresh();
  };
})();
</script>
